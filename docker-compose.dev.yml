# =============================================================================
# Development — MỘT FILE đầy đủ (không merge infra + overlay) để Docker luôn publish ports.
# Nếu dùng: docker compose -f docker-compose.dev.yml only
#
# docker compose --env-file .env.dev -f docker-compose.dev.yml up -d
# pgAdmin: ... --profile tools up -d
#
# Staging/prod vẫn dùng docker-compose.yml (include infra + app).
# =============================================================================

name: notrelix

services:

  postgres:
    image: postgres:16-alpine
    container_name: notrelix-postgres-dev
    restart: unless-stopped
    ports:
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-notrelix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notrelix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - data-network
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: notrelix-redis-dev
    restart: unless-stopped
    ports:
      - "0.0.0.0:${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data-network
    logging: *default-logging

  rabbitmq:
    profiles: ["messaging"]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_local_only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - data-network
    logging: *default-logging

  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0.400
    container_name: notrelix-backend-dev
    working_dir: /src
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8000}:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8000
      ConnectionStrings__NotrelixDb: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-notrelix_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      JwtSettings__SecretKey: ${JWT_SECRET:-dev-only-change-me-not-for-production}
      JwtSettings__Issuer: ${JWT_ISSUER:-http://localhost:${BACKEND_PORT:-8000}}
      JwtSettings__Audience: ${JWT_AUDIENCE:-http://localhost:${FRONTEND_PORT:-3000}}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromEmail: ${EMAIL_FROM:-onboarding@resend.dev}
      Email__FromName: ${EMAIL_FROM_NAME:-Notrelix}
    volumes:
      - ./backend:/src
      - backend_nuget:/root/.nuget/packages
    command: >
      dotnet watch run
      --project Notrelix.API/Notrelix.API.csproj
      --no-launch-profile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - data-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: oven/bun:1.2-alpine
    container_name: notrelix-frontend-dev
    working_dir: /app
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}/api}
      NEXT_PUBLIC_APP_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - frontend-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: notrelix-nginx-dev
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-3080}:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - frontend-network
      - backend-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:9
    container_name: notrelix-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "0.0.0.0:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_nuget:
  frontend_node_modules:
  pgadmin_data:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
    internal: false
  data-network:
    driver: bridge
    internal: false
