# Trivy secret-scanning allow rules for runtime images (Security CI runtime-images lane).
# This is NOT a vulnerability waiver: vulnerability exceptions live in trivy-*.ignore files
# with expiry and digest binding. These rules only suppress known false-positive secrets
# that upstream base images ship by design.
allow-rules:
  - id: debian-snakeoil-key
    description: >
      Debian's ssl-cert package ships a publicly documented self-signed
      keypair (snakeoil) used by the packaging system on every Debian-derived
      image; it is not a credential and exists in every upstream build.
    path: ^/etc/ssl/private/ssl-cert-snakeoil\.key$
