name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/contracts/openapi/**"
      - "artifacts/contracts/**"
      - ".github/actions/setup-frontend/**"
      - ".github/workflows/fe-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "backend/contracts/openapi/**"
      - "artifacts/contracts/**"
      - ".github/actions/setup-frontend/**"
      - ".github/workflows/fe-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

env:
  CI: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Contract codegen drift
        run: pnpm codegen:check

      - name: Architecture
        run: pnpm check:architecture

      - name: Architecture docs
        run: pnpm check:architecture-docs

      - name: Test taxonomy
        run: pnpm check:test-taxonomy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

  test-core:
    name: Core tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Node unit tests
        run: pnpm test:node:guarded

      - name: Web component tests
        run: pnpm test:web:guarded

      - name: Integration tests
        run: pnpm test:integration:guarded

  test-mobile:
    name: Mobile tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Mobile tests with category coverage
        run: pnpm test:mobile:guarded

  test-tooling:
    name: Tooling and generator tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Generator golden paths
        run: pnpm test:generators:guarded

  ui-foundation:
    name: UI foundation
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook a11y and visual gates
        run: pnpm test:ui:freeze

      - name: Upload UI Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-playwright-report
          path: frontend/playwright-report-ui
          if-no-files-found: ignore
          retention-days: 3

  build-web:
    name: Build web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://api.example.invalid/api/v1
      VITE_WS_URL: wss://api.example.invalid/realtime
      VITE_APP_URL: http://127.0.0.1:4173
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_MOCK_API: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Build web app
        run: pnpm --filter @notrelix/app-web build

      - name: Upload exact web build for E2E
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: frontend/apps/web/dist
          if-no-files-found: error
          retention-days: 1

  build-marketing:
    name: Build marketing
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Build marketing app
        run: pnpm --filter @notrelix/app-marketing build

  build-mobile:
    name: Build mobile
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
      EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/realtime
      EXPO_PUBLIC_APP_URL: https://app.example.invalid
      EXPO_PUBLIC_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Expo export
        run: pnpm --filter @notrelix/app-mobile build

  e2e-production:
    name: Production E2E
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_API_URL: https://api.example.invalid/api/v1
      VITE_WS_URL: wss://api.example.invalid/realtime
      VITE_APP_URL: http://127.0.0.1:4173
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_MOCK_API: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Download exact web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production E2E
        run: pnpm e2e

      - name: Upload production Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-playwright-report
          path: frontend/playwright-report-production
          if-no-files-found: ignore
          retention-days: 3

  frontend-gate:
    name: Frontend gate
    if: always()
    needs:
      - quality
      - test-core
      - test-mobile
      - test-tooling
      - ui-foundation
      - build-web
      - build-marketing
      - build-mobile
      - e2e-production
      - mock-contract
      - mock-e2e
      - mock-artifact-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every frontend gate
        shell: bash
        run: |
          results=(
            "${{ needs.quality.result }}"
            "${{ needs.test-core.result }}"
            "${{ needs.test-mobile.result }}"
            "${{ needs.test-tooling.result }}"
            "${{ needs.ui-foundation.result }}"
            "${{ needs.build-web.result }}"
            "${{ needs.build-marketing.result }}"
            "${{ needs.build-mobile.result }}"
            "${{ needs.e2e-production.result }}"
            "${{ needs.mock-contract.result }}"
            "${{ needs.mock-e2e.result }}"
            "${{ needs.mock-artifact-isolation.result }}"
          )

          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "Frontend required job did not succeed: $result"
              exit 1
            fi
          done

          echo "All required frontend CI gates passed."

  mock-contract:
    name: Mock contract
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Mock contract structural closure + conformance + freeze check
        run: pnpm mock:contract

  mock-e2e:
    name: Mock E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persona: [owner, admin, member, viewer]
        state: [default, new-user, empty-workspace, permission-limited, expired-session]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mock E2E (${{ matrix.persona }}/${{ matrix.state }})
        working-directory: frontend
        env:
          VITE_MOCK_PERSONA: ${{ matrix.persona }}
          VITE_MOCK_STATE: ${{ matrix.state }}
        run: pnpm e2e:mock

      - name: Assert E2E count gate
        working-directory: frontend
        run: pnpm e2e:mock:count

      - name: Upload mock Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mock-playwright-report-${{ matrix.persona }}-${{ matrix.state }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 3

  mock-artifact-isolation:
    name: Mock artifact isolation
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Download exact web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/dist

      - name: Assert production build contains no mock artifacts
        working-directory: frontend
        run: pnpm check:production-mock-isolation

