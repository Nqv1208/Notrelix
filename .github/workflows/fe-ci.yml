name: Frontend CI

on:
  push:
    branches: [main, develop, foundationfreeze]
    paths:
      - 'frontend/**'
      - 'backend/contracts/openapi/**'
      - 'artifacts/contracts/**'
      - '.github/workflows/fe-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/contracts/openapi/**'
      - 'artifacts/contracts/**'
      - '.github/workflows/fe-ci.yml'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

  contract-codegen:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check contract codegen drift
        run: pnpm codegen:check
        working-directory: frontend

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Type check
        run: pnpm typecheck
        working-directory: frontend

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

  test-node:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run Node unit tests
        run: pnpm test:node:guarded
        working-directory: frontend

  test-web:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run Web component/integration tests
        run: pnpm test:web:guarded
        working-directory: frontend

  check-deps:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend architecture
        run: pnpm check:deps
        working-directory: frontend

      - name: Check architecture docs
        run: pnpm check:architecture-docs
        working-directory: frontend

  test-freeze-gates:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run mobile tests
        run: pnpm test:mobile:guarded
        working-directory: frontend

      - name: Run integration tests
        run: pnpm test:integration:guarded
        working-directory: frontend

      - name: Run generator tests
        run: pnpm test:generators:guarded
        working-directory: frontend

      - name: Run package test fan-out
        run: pnpm test:fanout
        working-directory: frontend

      - name: Run freeze audit
        run: pnpm freeze:audit
        working-directory: frontend

  test-ui-freeze:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run UI freeze gates (storybook build + a11y + visual smoke)
        run: pnpm test:ui:freeze
        working-directory: frontend
        env:
          CI: "1"

  build-web:
    needs: [typecheck, lint, test-node, test-web, test-freeze-gates, test-ui-freeze, check-deps]
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid/api/v1
      VITE_WS_URL: wss://api.example.invalid/realtime
      VITE_APP_URL: http://127.0.0.1:4173
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_MOCK_API: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build web app
        run: pnpm --filter @notrelix/app-web build
        working-directory: frontend

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/dist
          if-no-files-found: error
          retention-days: 7

  build-marketing:
    needs: [typecheck, lint, test-node, test-web, test-freeze-gates, test-ui-freeze, check-deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build marketing app
        run: pnpm --filter @notrelix/app-marketing build
        working-directory: frontend

      - name: Upload marketing build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-build
          path: frontend/apps/marketing/.next
          if-no-files-found: error
          retention-days: 7

  production-e2e:
    needs: [build-web]
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid/api/v1
      VITE_WS_URL: wss://api.example.invalid/realtime
      VITE_APP_URL: http://127.0.0.1:4173
      VITE_RELEASE_SHA: ${{ github.sha }}
      VITE_MOCK_API: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: frontend/apps/web/dist

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        run: pnpm e2e
        working-directory: frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend-gate:
    if: always()
    needs:
      - contract-codegen
      - typecheck
      - lint
      - test-node
      - test-web
      - test-freeze-gates
      - test-ui-freeze
      - check-deps
      - build-web
      - build-marketing
      - production-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate results
        run: |
          results=(
            "${{ needs.contract-codegen.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test-node.result }}"
            "${{ needs.test-web.result }}"
            "${{ needs.test-freeze-gates.result }}"
            "${{ needs.test-ui-freeze.result }}"
            "${{ needs.check-deps.result }}"
            "${{ needs.build-web.result }}"
            "${{ needs.build-marketing.result }}"
            "${{ needs.production-e2e.result }}"
          )
          for res in "${results[@]}"; do
            if [ "$res" != "success" ]; then
              echo "❌ One or more upstream jobs failed, were skipped, or cancelled: $res"
              exit 1
            fi
          done
          echo "✅ All frontend CI gates passed successfully!"
