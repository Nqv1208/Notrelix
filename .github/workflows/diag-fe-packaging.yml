name: Diagnostic Packaging A/B

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diag-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-ab:
    name: A/B container smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: alpine
            base_image: node:22-alpine
          - target: bookworm-slim
            base_image: node:22-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Build production container (diagnostic)
        run: docker build --file frontend/Dockerfile.diag --build-arg BASE_IMAGE="${{ matrix.base_image }}" --tag "notrelix-web-diag:${{ matrix.target }}" .
