name: CI Definition

on:
  workflow_call:
    inputs:
      source_sha: {required: true, type: string}
      plan_sha256: {required: true, type: string}

permissions:
  contents: read

jobs:
  static:
    name: Static definition checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runtime prerequisite
        run: |
          python3 - <<'EOF'
          import sys
          import tomllib  # noqa: F401
          assert sys.version_info >= (3, 11), f"python3 {sys.version_info} too old"
          EOF
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Compile CI scripts
        run: python3 -m compileall -q scripts/ci
      - name: Syntax-check host artifact helpers
        run: |
          cd frontend
          node --check scripts/ci/package-host-artifact.mjs
          node --check scripts/ci/restore-host-artifact.mjs
          node --check scripts/ci/check-pnpm-audit.mjs
          node --check scripts/ci/playwright-result-summary.mjs
          node --check scripts/ci/resolve-frontend-ci-contract.mjs
      - name: Run host artifact roundtrip test
        run: |
          cd frontend
          node scripts/ci/host-artifact.roundtrip.test.mjs
      - name: Run shared Playwright parser tests
        run: |
          cd frontend
          node scripts/ci/playwright-result-summary.test.mjs
      - name: Run frontend contract resolver tests
        run: |
          cd frontend
          node scripts/ci/resolve-frontend-ci-contract.test.mjs

  contracts:
    name: Delivery contracts validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile deliveryctl and CI scripts
        run: python3 -m compileall -q tools/deliveryctl scripts/ci
      - name: Validate delivery definition
        run: python3 -m tools.deliveryctl validate
      - name: Run architecture checks
        run: python3 -m tools.deliveryctl architecture-check
      - name: Check visual documentation
        run: python3 -m tools.deliveryctl visual --check
      - name: Run deliveryctl unit tests
        run: python3 -m unittest discover -s tools/deliveryctl/tests -p 'test_*.py' -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      - name: Run emit-evidence contract test
        working-directory: .github/actions/emit-evidence
        run: node contract.test.mjs

  proof:
    name: CI Definition Safety gate
    if: always()
    needs: [static, contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: inputs.source_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require CI definition proof
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require static "$(result static)"
          require contracts "$(result contracts)"
      - if: inputs.source_sha != ''
        uses: ./.github/actions/emit-evidence
        with:
          proof_id: 'delivery:platform'
          component_id: ci-definition
          plan_sha256: ${{ inputs.plan_sha256 }}
          source_sha: ${{ inputs.source_sha }}
