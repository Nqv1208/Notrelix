name: Backend CI

on:
  push:
    branches: [main, develop, foundationfreeze]
    paths:
      - 'backend/**'
      - '.github/workflows/be-ci.yml'

  pull_request:
    branches: [main, develop, foundationfreeze]
    paths:
      - 'backend/**'
      - '.github/workflows/be-ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  quality:
    name: Restore, format, build, security guards
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Show .NET info
        working-directory: backend
        run: |
          dotnet --version
          dotnet --info

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Format check
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Vulnerability scan
        working-directory: backend
        run: |
          set -euo pipefail

          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-report.txt

          if grep -q "has the following vulnerable packages" vulnerable-report.txt; then
            echo "Vulnerable packages found!"
            exit 1
          fi

          echo "No vulnerable packages found"

      - name: Guard dependency graph against SQLite
        working-directory: backend
        run: |
          set -euo pipefail

          dotnet list package --include-transitive 2>&1 | tee dependency-report.txt

          if grep -iE "SQLite|Sqlite|SQLitePCLRaw|Microsoft\.Data\.Sqlite|Microsoft\.EntityFrameworkCore\.Sqlite" dependency-report.txt; then
            echo "SQLite dependency detected in Notrelix backend dependency graph."
            echo "Use PostgreSQL/Testcontainers instead of SQLite."
            exit 1
          fi

          echo "No SQLite dependencies found"

      - name: Guard source against SQLite usage
        working-directory: backend
        run: |
          set -euo pipefail

          matches=$(grep -RInE "UseSqlite|SqliteConnection|Microsoft\.EntityFrameworkCore\.Sqlite|Microsoft\.Data\.Sqlite|SQLitePCLRaw|DataSource=:memory:" \
            src tests Directory.Packages.props \
            --include="*.cs" \
            --include="*.csproj" \
            --include="*.props" \
            --exclude="DatabaseProviderArchitectureTests.cs" || true)

          if [ -n "$matches" ]; then
            echo "$matches"
            echo "SQLite usage detected in Notrelix backend source."
            echo "Use PostgreSQL/Testcontainers instead."
            exit 1
          fi

          echo "No SQLite source references found"

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Architecture tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Architecture.Tests/Notrelix.Architecture.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Domain tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Domain.Tests/Notrelix.Domain.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

      - name: Verify contract tests did not rewrite approved snapshots
        working-directory: backend
        run: >
          git diff
          --exit-code
          --
          tests/Notrelix.Domain.Tests/Snapshots

      - name: Export OpenAPI spec and verify no drift
        working-directory: backend
        env:
          DOTNET_ENVIRONMENT: Development
        run: |
          test -f contracts/openapi/notrelix.v1.json
          git ls-files --error-unmatch contracts/openapi/notrelix.v1.json
          dotnet run \
            --project src/Notrelix.API/Notrelix.API.csproj \
            --configuration $DOTNET_CONFIGURATION \
            --no-build \
            -- \
            --export-openapi \
            /tmp/notrelix.v1.generated.json
          cmp contracts/openapi/notrelix.v1.json /tmp/notrelix.v1.generated.json \
            || (echo "OpenAPI spec drift detected. Regenerate: dotnet run --project src/Notrelix.API -- --export-openapi contracts/openapi/notrelix.v1.json" && exit 1)

      - name: Application tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Application.Tests/Notrelix.Application.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

      - name: Infrastructure tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Infrastructure.Tests/Notrelix.Infrastructure.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

  platform-tests:
    name: Platform tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Platform tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Platform.Tests/Notrelix.Platform.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

  api-tests:
    name: API contract tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false

      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000

      ForwardedHeaders__RequireKnownProxyInProduction: false

      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: 60
      JwtSettings__RefreshTokenExpireDays: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: API tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.API.Tests/Notrelix.API.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false

      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000

      ForwardedHeaders__RequireKnownProxyInProduction: false

      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: 60
      JwtSettings__RefreshTokenExpireDays: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Integration tests
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION

  foundation-provider-tests:
    name: Foundation provider tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false

      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000

      ForwardedHeaders__RequireKnownProxyInProduction: false

      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: 60
      JwtSettings__RefreshTokenExpireDays: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx

      - name: Build
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration $DOTNET_CONFIGURATION

      - name: Foundation — idempotency store, tenancy, inbox/outbox, DI graph
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION
          --filter
          "FullyQualifiedName~IdempotencyStoreIntegrationTests|FullyQualifiedName~TenantIsolationTests|FullyQualifiedName~CrossTenantIsolationTests|FullyQualifiedName~DeduplicationConsumeFilterIntegrationTests|FullyQualifiedName~DeduplicationConsumeFilterFullIntegrationTests|FullyQualifiedName~MigrationSmokeTests|FullyQualifiedName~ProductionCompositionTests"

      - name: Foundation — RLS policy verification and outbox interceptor
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Infrastructure.Tests/Notrelix.Infrastructure.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION
          --filter
          "FullyQualifiedName~RlsPolicyVerificationTests|FullyQualifiedName~DomainEventInterceptorTests"

      - name: Foundation — API idempotency integration
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.API.Tests/Notrelix.API.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION
          --filter
          "FullyQualifiedName~IdempotencyEndpointContractTests"

      - name: Foundation — platform messaging reliability
        working-directory: backend
        run: >
          dotnet test
          tests/Notrelix.Platform.Tests/Notrelix.Platform.Tests.csproj
          --no-build
          --configuration $DOTNET_CONFIGURATION
          --filter
          "FullyQualifiedName~Messaging.Reliability|FullyQualifiedName~ConsumerHostDeliveryContractTests"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - architecture-tests
      - unit-tests
      - platform-tests
      - api-tests
      - integration-tests
      - foundation-provider-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: notrelix/backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: |
          docker image inspect notrelix/backend:ci-${{ github.sha }} > /dev/null
          echo "Docker image built successfully"