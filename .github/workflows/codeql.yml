name: CodeQL
on:
  pull_request: {branches: [main, develop]}
  merge_group:
  push: {branches: [main, develop]}
  schedule: [{cron: '30 2 * * 2'}]
  workflow_dispatch:
permissions: {contents: read, actions: read, security-events: write, packages: read}
jobs:
  csharp:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: {languages: csharp, build-mode: none, queries: security-extended}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: {category: '/language:csharp'}
  javascript-typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: {languages: javascript-typescript, build-mode: none, queries: security-extended}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: {category: '/language:javascript-typescript'}
