name: CodeQL

on:
  pull_request:
    branches: [main, develop, foundationfreeze]
  merge_group:
  push:
    branches: [main, develop, foundationfreeze]
  schedule:
    - cron: "30 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  packages: read

jobs:
  plan:
    name: Code scanning execution plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend_count: ${{ steps.plan.outputs.backend_count }}
      frontend_required: ${{ steps.plan.outputs.frontend_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: >-
          python3 scripts/ci/build-plan.py --event-name "$EVENT_NAME" --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA" --before-sha "$BEFORE_SHA" --ref "$GITHUB_REF"
          --output artifacts/ci/codeql-plan.json

  csharp:
    name: CodeQL (C#)
    needs: plan
    if: needs.plan.outputs.backend_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:csharp

  javascript-typescript:
    name: CodeQL (JavaScript/TypeScript)
    needs: plan
    if: needs.plan.outputs.frontend_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript
