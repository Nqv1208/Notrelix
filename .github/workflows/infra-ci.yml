name: Infrastructure CI

on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      topology_required: {required: true, type: boolean}
      assembled_required: {required: true, type: boolean}
      runtime_images_json: {required: true, type: string}
      source_sha: {required: true, type: string}
      plan_sha256: {required: true, type: string}
      schema_change: {required: true, type: string}

permissions:
  contents: read

env:
  FALLBACK_RUNTIME_IMAGES_JSON: '{"api_version":"delivery.notrelix.dev/v1","kind":"RuntimeImageSet","images":[{"id":"postgres","ref":"postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685","deploy_env_var":"NOTRELIX_POSTGRES_IMAGE"},{"id":"redis","ref":"redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf","deploy_env_var":"NOTRELIX_REDIS_IMAGE"},{"id":"rabbitmq","ref":"rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281","deploy_env_var":"NOTRELIX_RABBITMQ_IMAGE"},{"id":"nginx","ref":"nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10","deploy_env_var":"NOTRELIX_NGINX_IMAGE"}]}'

jobs:
  changes:
    name: Change detection and selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      topology_selected: ${{ steps.detect.outputs.topology_selected || steps.called.outputs.topology_selected }}
      assembled_selected: ${{ steps.detect.outputs.assembled_selected || steps.called.outputs.assembled_selected }}
      schema_change: ${{ steps.detect.outputs.schema_change || steps.called.outputs.schema_change }}
      nginx_ref: ${{ steps.detect.outputs.nginx_ref || steps.called.outputs.nginx_ref }}
      runtime_images_json: ${{ steps.detect.outputs.runtime_images_json || steps.called.outputs.runtime_images_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: called
        if: github.event_name == 'workflow_call'
        env:
          TOPOLOGY: ${{ inputs.topology_required }}
          ASSEMBLED: ${{ inputs.assembled_required }}
          SCHEMA_CHANGE: ${{ inputs.schema_change }}
          RUNTIME_IMAGES_JSON: ${{ inputs.runtime_images_json }}
        run: |
          set -euo pipefail
          {
            echo "topology_selected=$TOPOLOGY"
            echo "assembled_selected=$ASSEMBLED"
            echo "schema_change=$SCHEMA_CHANGE"
            echo "nginx_ref=$(jq -r '.images[] | select(.id == "nginx") | .ref' <<<"$RUNTIME_IMAGES_JSON")"
            echo "runtime_images_json=$RUNTIME_IMAGES_JSON"
          } >> "$GITHUB_OUTPUT"
      - id: detect
        if: github.event_name != 'workflow_call'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          infra=false; backend_selected=false; forced_all=false
          base="$BASE_SHA"; head="$HEAD_SHA"
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] && merge_base="$(git merge-base "$base" "$head" 2>/dev/null || true)" && [[ -n "$merge_base" ]]; then
                base="$merge_base"
              else
                forced_all=true
              fi
              ;;
            push)
              head="$GITHUB_SHA"; base="$BEFORE_SHA"
              if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == "0000000000000000000000000000000000000000" ]]; then
                forced_all=true
              fi
              ;;
            *)
              forced_all=true
              ;;
          esac
          if [[ "$forced_all" == true ]]; then
            infra=true; backend_selected=true
          elif files="$(git diff --name-only --diff-filter=ACMRDTUXB "$base" "$head" 2>/dev/null)"; then
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                docker-compose.yml|docker-compose.prod.yml|docker-compose.staging.yml) infra=true ;;
                infra/**) infra=true ;;
                scripts/ci/validate-infra.py) infra=true ;;
                scripts/ci/write-test-env.sh) infra=true ;;
                .github/workflows/infra-ci.yml) infra=true ;;
                .dockerignore) infra=true ;;
                frontend/apps/web/nginx.conf) infra=true ;;
                frontend/Dockerfile|frontend/Dockerfile.marketing|backend/Dockerfile) backend_selected=true ;;
              esac
              [[ "$infra:$backend_selected" == "true:true" ]] && break
            done <<< "$files"
          else
            infra=true; backend_selected=true
          fi
          [[ "$infra" == true || "$backend_selected" == true ]] && selected=true || selected=false
          {
            echo "topology_selected=$selected"
            echo "assembled_selected=$selected"
            echo "schema_change=false"
            echo "nginx_ref=$(jq -r '.images[] | select(.id == "nginx") | .ref' <<<"$FALLBACK_RUNTIME_IMAGES_JSON")"
            echo "runtime_images_json=$FALLBACK_RUNTIME_IMAGES_JSON"
          } >> "$GITHUB_OUTPUT"

  topology:
    name: Static topology validation
    needs: changes
    if: needs.changes.outputs.topology_selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NGINX_REF: ${{ needs.changes.outputs.nginx_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose topology and rootless invariants
        run: python3 scripts/ci/validate-infra.py
      - name: Validate staging nginx syntax
        run: docker run --rm -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" "$NGINX_REF" nginx -t
      - name: Validate production nginx syntax
        run: docker run --rm -v "$PWD/infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro" "$NGINX_REF" nginx -t

  assembled:
    name: Assembled stack health
    needs: changes
    if: needs.changes.outputs.assembled_selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HTTP_PORT: "8080"
      RUNTIME_IMAGES_JSON: ${{ needs.changes.outputs.runtime_images_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral environment with resolved runtime images
        run: |
          bash scripts/ci/write-test-env.sh /tmp/notrelix-creds.env
          jq -r '.images[] | select(.deploy_env_var != null and .deploy_env_var != "") | "\(.deploy_env_var)=\(.ref)"' <<<"$RUNTIME_IMAGES_JSON" > /tmp/notrelix-images.env
          cat /tmp/notrelix-creds.env /tmp/notrelix-images.env > /tmp/notrelix-infra.env
          chmod 600 /tmp/notrelix-infra.env
      - name: Compose config
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml config --quiet
      - name: Build backend, web and marketing images
        run: |
          docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml build backend frontend-web frontend-marketing
      - name: Start dependency services
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml up -d postgres redis rabbitmq
      - name: Apply migrations
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml run --rm backend --migrate
      - name: Apply RLS policies
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml run --rm backend --rls-apply
      - name: Start full stack
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
      - name: Wait for health endpoints
        timeout-minutes: 10
        run: |
          for url in "http://127.0.0.1:8080/health/live" "http://127.0.0.1:8080/sign-in" "http://127.0.0.1:8080/"; do
            code=000; attempts=0
            while [[ "$code" != 200 && "$attempts" -lt 60 ]]; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
              attempts=$((attempts + 1))
              [[ "$code" != 200 ]] && sleep 5
            done
            if [[ "$code" != 200 ]]; then
              echo "health probe failed for $url (HTTP $code)"
              docker compose -f docker-compose.yml -f docker-compose.staging.yml ps
              exit 1
            fi
          done
      - name: Tear down stack
        if: always()
        run: docker compose --env-file /tmp/notrelix-infra.env -f docker-compose.yml -f docker-compose.staging.yml down -v --remove-orphans || true

  proof:
    name: Infrastructure CI gate
    if: always()
    needs: [changes, topology, assembled]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require infrastructure proof when selected
        env:
          TOPOLOGY_SELECTED: ${{ needs.changes.outputs.topology_selected }}
          ASSEMBLED_SELECTED: ${{ needs.changes.outputs.assembled_selected }}
          SCHEMA_CHANGE: ${{ needs.changes.outputs.schema_change }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          allowed_unselected(){ local name="$1" result="$2"; [[ "$result" == skipped || "$result" == success ]] || { echo "::error::$name unexpected result=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require changes "$(result changes)"
          if [[ "$SCHEMA_CHANGE" == true && "$ASSEMBLED_SELECTED" != true ]]; then
            echo "::error::schema change requires assembled stack proof"
            exit 1
          fi
          if [[ "$TOPOLOGY_SELECTED" == true ]]; then require topology "$(result topology)"; else allowed_unselected topology "$(result topology)"; fi
          if [[ "$ASSEMBLED_SELECTED" == true ]]; then require assembled "$(result assembled)"; else allowed_unselected assembled "$(result assembled)"; fi
      - if: github.event_name == 'workflow_call'
        uses: ./.github/actions/emit-evidence
        with:
          proof_id: 'infra:gate'
          component_id: infra-gate
          plan_sha256: ${{ inputs.plan_sha256 }}
          source_sha: ${{ inputs.source_sha }}
