name: Notrelix CI
on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  plan:
    name: Delivery execution plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      backend_matrix: ${{ steps.plan.outputs.backend_matrix }}
      backend_count: ${{ steps.plan.outputs.backend_count }}
      frontend_host_matrix: ${{ steps.plan.outputs.frontend_host_matrix }}
      host_count: ${{ steps.plan.outputs.host_count }}
      mobile_matrix: ${{ steps.plan.outputs.mobile_matrix }}
      mobile_count: ${{ steps.plan.outputs.mobile_count }}
      container_matrix: ${{ steps.plan.outputs.container_matrix }}
      container_count: ${{ steps.plan.outputs.container_count }}
      frontend_required: ${{ steps.plan.outputs.frontend_required }}
      frontend_filters_json: ${{ steps.plan.outputs.frontend_filters_json }}
      frontend_capabilities_json: ${{ steps.plan.outputs.frontend_capabilities_json }}
      renderer_ref: ${{ steps.plan.outputs.renderer_ref }}
      renderer_version: ${{ steps.plan.outputs.renderer_version }}
      runtime_images_json: ${{ steps.plan.outputs.runtime_images_json }}
      deployable_containers_json: ${{ steps.plan.outputs.deployable_containers_json }}
      release_contract_json: ${{ steps.plan.outputs.release_contract_json }}
      mock_artifact_component: ${{ steps.plan.outputs.mock_artifact_component }}
      mock_artifact_name: ${{ steps.plan.outputs.mock_artifact_name }}
      mock_archive_file: ${{ steps.plan.outputs.mock_archive_file }}
      mock_manifest_file: ${{ steps.plan.outputs.mock_manifest_file }}
      docs_required: ${{ steps.plan.outputs.docs_required }}
      infra_required: ${{ steps.plan.outputs.infra_required }}
      security_backend: ${{ steps.plan.outputs.security_backend }}
      security_frontend: ${{ steps.plan.outputs.security_frontend }}
      packaging_required: ${{ steps.plan.outputs.packaging_required }}
      release_candidate: ${{ steps.plan.outputs.release_candidate }}
      schema_change: ${{ steps.plan.outputs.schema_change }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Verify control-plane runtime
        run: |
          python3 - <<'PY'
          import sys,tomllib
          assert sys.version_info >= (3,11), sys.version
          PY
      - run: python3 -m tools.deliveryctl validate
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          python3 -m tools.deliveryctl plan \
            --event-name "$EVENT_NAME" --ref "$GITHUB_REF" --source-sha "$GITHUB_SHA" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --before-sha "$BEFORE_SHA" \
            --output artifacts/ci/execution-plan.json --github-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-execution-plan
          path: artifacts/ci/execution-plan.json
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend provider (${{ matrix.component_id }})
    needs: plan
    if: needs.plan.outputs.backend_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.backend_matrix) }}
    uses: ./.github/workflows/backend-ci.yml
    with:
      component_id: ${{ matrix.component_id }}
      redis_image: ${{ matrix.redis_image }}

  frontend:
    name: Frontend provider
    needs: plan
    if: needs.plan.outputs.frontend_required == 'true'
    uses: ./.github/workflows/frontend-ci.yml
    with:
      host_matrix_json: ${{ needs.plan.outputs.frontend_host_matrix }}
      host_count: ${{ fromJSON(needs.plan.outputs.host_count) }}
      mobile_matrix_json: ${{ needs.plan.outputs.mobile_matrix }}
      mobile_count: ${{ fromJSON(needs.plan.outputs.mobile_count) }}
      filters_json: ${{ needs.plan.outputs.frontend_filters_json }}
      capabilities_json: ${{ needs.plan.outputs.frontend_capabilities_json }}
      renderer_ref: ${{ needs.plan.outputs.renderer_ref }}
      renderer_version: ${{ needs.plan.outputs.renderer_version }}
      mock_artifact_component: ${{ needs.plan.outputs.mock_artifact_component }}
      mock_artifact_name: ${{ needs.plan.outputs.mock_artifact_name }}
      mock_archive_file: ${{ needs.plan.outputs.mock_archive_file }}
      mock_manifest_file: ${{ needs.plan.outputs.mock_manifest_file }}

  documentation:
    needs: plan
    if: needs.plan.outputs.docs_required == 'true'
    uses: ./.github/workflows/docs-ci.yml

  infrastructure:
    needs: plan
    if: needs.plan.outputs.infra_required == 'true'
    uses: ./.github/workflows/infra-ci.yml
    with:
      runtime_images_json: ${{ needs.plan.outputs.runtime_images_json }}
      deployable_containers_json: ${{ needs.plan.outputs.deployable_containers_json }}

  security:
    needs: plan
    if: needs.plan.outputs.security_backend == 'true' || needs.plan.outputs.security_frontend == 'true'
    uses: ./.github/workflows/security-ci.yml
    with:
      scan_backend: ${{ needs.plan.outputs.security_backend == 'true' }}
      scan_frontend: ${{ needs.plan.outputs.security_frontend == 'true' }}

  packaging:
    needs: plan
    if: needs.plan.outputs.packaging_required == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/container-ci.yml
    with:
      component_matrix_json: ${{ needs.plan.outputs.container_matrix }}
      component_count: ${{ fromJSON(needs.plan.outputs.container_count) }}
      publish_candidate: ${{ needs.plan.outputs.release_candidate == 'true' }}

  assemble-release:
    name: Assemble immutable release set
    needs: [plan, packaging]
    if: needs.plan.outputs.release_candidate == 'true' && needs.packaging.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      release_images_json: ${{ steps.assemble.outputs.release_images_json }}
    steps:
      - id: assemble
        env:
          RUNTIME: ${{ needs.plan.outputs.runtime_images_json }}
          APPLICATION: ${{ needs.packaging.outputs.application_manifest_json }}
        run: |
          set -euo pipefail
          release="$(jq -cn --argjson runtime "$RUNTIME" --argjson app "$APPLICATION" '{api_version:"delivery.notrelix.dev/v1",kind:"ReleaseImageSet",images:(($runtime.images+$app.images)|sort_by(.compose_service))}')"
          jq -e '.images|length>0 and all(.[];.ref|contains("@sha256:"))' <<<"$release" >/dev/null
          echo "release_images_json=$(jq -c . <<<"$release")" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/release; jq . <<<"$release" > artifacts/release/release-images.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: release-image-set, path: artifacts/release/release-images.json, if-no-files-found: error, retention-days: 30}

  candidate-stack:
    needs: [plan, assemble-release]
    if: needs.plan.outputs.release_candidate == 'true' && needs.assemble-release.result == 'success'
    permissions: {contents: read, packages: read}
    uses: ./.github/workflows/stack-smoke.yml
    with:
      release_images_json: ${{ needs.assemble-release.outputs.release_images_json }}
      release_contract_json: ${{ needs.plan.outputs.release_contract_json }}

  proof-gate:
    name: Evidence completeness gate
    if: always()
    needs: [plan, backend, frontend, documentation, infrastructure, security, packaging, candidate-stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-execution-plan, path: artifacts/plan}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'ci-evidence-*', path: artifacts/evidence, merge-multiple: true}
      - run: python3 -m tools.deliveryctl evidence-aggregate --plan artifacts/plan/execution-plan.json --evidence-dir artifacts/evidence --output artifacts/ci/evidence-summary.json --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: ci-evidence-summary, path: artifacts/ci/evidence-summary.json, if-no-files-found: error, retention-days: 30}

  seal-candidate:
    name: Seal immutable release candidate
    if: always() && needs.plan.outputs.release_candidate == 'true'
    needs: [plan, assemble-release, candidate-stack, proof-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - name: Require release proof chain
        env: {ASSEMBLE: '${{ needs.assemble-release.result }}', STACK: '${{ needs.candidate-stack.result }}', PROOF: '${{ needs.proof-gate.result }}'}
        run: '[[ "$ASSEMBLE" == success && "$STACK" == success && "$PROOF" == success ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: ci-evidence-summary, path: artifacts/evidence}
      - name: Create ReleaseCandidate manifest
        env:
          IMAGES: ${{ needs.assemble-release.outputs.release_images_json }}
          CONTRACT: ${{ needs.plan.outputs.release_contract_json }}
          PLAN_SHA: ${{ needs.plan.outputs.plan_sha256 }}
          SCHEMA_CHANGE: ${{ needs.plan.outputs.schema_change }}
        run: |
          summary="$(jq -r .summary_sha256 artifacts/evidence/evidence-summary.json)"
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg plan "$PLAN_SHA" --arg evidence "$summary" --argjson images "$IMAGES" --argjson contract "$CONTRACT" --argjson schema "$SCHEMA_CHANGE" '{api_version:"delivery.notrelix.dev/v1",kind:"ReleaseCandidate",source_sha:$sha,ci_run_id:$run,plan_sha256:$plan,evidence_summary_sha256:$evidence,schema_change:$schema,release_contract:$contract,images:$images.images}' > release-candidate.json
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with: {subject-path: release-candidate.json}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: release-candidate, path: release-candidate.json, if-no-files-found: error, retention-days: 30}

  ci-gate:
    name: Notrelix CI Gate
    if: always()
    needs: [plan, proof-gate, seal-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          PROOF: ${{ needs.proof-gate.result }}
          REQUIRED: ${{ needs.plan.outputs.release_candidate }}
          SEALED: ${{ needs.seal-candidate.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN" == success && "$PROOF" == success ]]
          if [[ "$REQUIRED" == true ]]; then [[ "$SEALED" == success ]]; else [[ "$SEALED" == skipped || "$SEALED" == success ]]; fi
