name: Notrelix CI

# One pull-request gate, jobs in parallel, only the side that changed.
# Slow or flaky suites (visual, image scans, CodeQL) run on schedule, never here.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: notrelix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push without a usable base (new branch, manual run) checks everything.
          if [[ -z "${BASE:-}" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          shared='^(\.github/|backend/contracts/)'
          grep -qE "$shared|^backend/" <<<"$files" && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          grep -qE "$shared|^frontend/" <<<"$files" && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  backend-unit:
    name: Backend build and unit tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - run: dotnet restore backend.slnx
      - run: dotnet format backend.slnx --verify-no-changes --no-restore
      - run: dotnet build backend.slnx --no-restore --configuration "$DOTNET_CONFIGURATION"
      - name: Domain, Application, Infrastructure, Architecture, Platform and API tests
        run: |
          set -euo pipefail
          for p in Domain Application Infrastructure Architecture Platform API; do
            dotnet test "tests/Notrelix.$p.Tests/Notrelix.$p.Tests.csproj" --no-build --configuration "$DOTNET_CONFIGURATION" --blame-hang-timeout 5m
          done
      - name: OpenAPI contract has no drift
        env:
          DOTNET_ENVIRONMENT: Development
          Messaging__Transport: InMemory
          Database__MigrateOnStartup: "false"
          SeedData__RunOnStartup: "false"
        run: |
          set -euo pipefail
          dotnet run --project src/Notrelix.API/Notrelix.API.csproj --configuration "$DOTNET_CONFIGURATION" --no-build -- --export-openapi /tmp/notrelix.v1.json
          cmp contracts/openapi/notrelix.v1.json /tmp/notrelix.v1.json

  backend-integration:
    name: Integration tests (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The last shard is the complement of the others, so every test runs exactly once.
        shard:
          - name: workspaces-auth
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Workspaces.|FullyQualifiedName~Notrelix.Integration.Tests.Auth.
          - name: work-rls
            filter: FullyQualifiedName~Notrelix.Integration.Tests.WorkManagement.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.
          - name: rest
            filter: FullyQualifiedName!~Notrelix.Integration.Tests.Workspaces.&FullyQualifiedName!~Notrelix.Integration.Tests.Auth.&FullyQualifiedName!~Notrelix.Integration.Tests.WorkManagement.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.
    services:
      redis:
        image: redis@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false
      Cors__AllowedOrigins__0: http://localhost:5173
      ForwardedHeaders__RequireKnownProxyInProduction: "false"
      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: "60"
      JwtSettings__RefreshTokenExpireDays: "7"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - run: dotnet restore tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
      - run: >
          dotnet test tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
          --no-restore --configuration "$DOTNET_CONFIGURATION" --blame-hang-timeout 5m
          --filter "${{ matrix.shard.filter }}"

  frontend:
    name: Frontend checks and tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:architecture
      - run: pnpm check:i18n
      - run: pnpm codegen:check
      - run: pnpm test:node
      - run: pnpm test:web
      - run: pnpm --filter @notrelix/app-web build

  dependencies:
    name: Dependency audit
    uses: ./.github/workflows/security-ci.yml
    with:
      scan_backend: true
      scan_frontend: true

  ci-gate:
    name: CI gate
    needs: [changes, backend-unit, backend-integration, frontend, dependencies]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        run: |
          set -euo pipefail
          ok(){ [[ "$2" == success || "$2" == skipped ]] || { echo "::error::$1=$2"; exit 1; }; }
          [[ "${{ needs.changes.result }}" == success ]] || { echo "::error::changes=${{ needs.changes.result }}"; exit 1; }
          ok backend-unit "${{ needs.backend-unit.result }}"
          ok backend-integration "${{ needs.backend-integration.result }}"
          ok frontend "${{ needs.frontend.result }}"
          ok dependencies "${{ needs.dependencies.result }}"
