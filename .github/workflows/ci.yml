name: Notrelix CI

# One pull-request gate, jobs in parallel, only the side that changed.
# Slow or flaky suites (visual, image scans, CodeQL) run on schedule, never here.
# On a push to a release/** branch that follows a green CI gate and touches deployable code, the release-* jobs at the
# end publish the images, run the full stack on those exact digests and attest the release candidate
# that release.yml deploys to staging. A push to main runs the gate only. They never run on pull requests.

on:
  pull_request:
    branches: [main, develop, 'release/**']
  push:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: notrelix-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use-case counts
        # Informational: plain node, no install; never part of the gate (continue-on-error).
        continue-on-error: true
        run: |
          echo "### Use-case counts" >> "$GITHUB_STEP_SUMMARY"
          node scripts/docs/uc-counts.mjs >> "$GITHUB_STEP_SUMMARY"
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A push without a usable base (new branch, manual run) checks everything.
          if [[ -z "${BASE:-}" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          shared='^(\.github/|backend/contracts/)'
          grep -qE "$shared|^backend/" <<<"$files" && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          grep -qE "$shared|^frontend/" <<<"$files" && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"

  # Cheap checks run first and alone: a failure here stops every heavy job below (needs:), so a format slip costs ~2 minutes, not a full run.
  fast-checks-backend:
    name: Fast checks (backend ${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Format and the build-based checks are each ~2.5 min, so they run side by side.
      matrix:
        check: [format, contract]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: Restore NuGet packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore backend.slnx
      - name: Format
        if: matrix.check == 'format'
        run: dotnet format backend.slnx --verify-no-changes --no-restore
      # The pre-push hook's own tests: a throw-away repo, only the .NET SDK needed. It runs from the repository root, not from backend.
      - name: Pre-push hook self-test
        if: ${{ !cancelled() && matrix.check == 'format' }}
        working-directory: .
        run: bash .githooks/test/pre-push.test.sh
      - name: Architecture tests
        if: ${{ !cancelled() && matrix.check == 'contract' }}
        run: dotnet test tests/Notrelix.Architecture.Tests/Notrelix.Architecture.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --blame-hang-timeout 5m
      - name: OpenAPI contract has no drift
        if: ${{ !cancelled() && matrix.check == 'contract' }}
        env:
          DOTNET_ENVIRONMENT: Development
          Messaging__Transport: InMemory
          Database__MigrateOnStartup: "false"
          SeedData__RunOnStartup: "false"
        run: |
          set -euo pipefail
          dotnet run --project src/Notrelix.API/Notrelix.API.csproj --configuration "$DOTNET_CONFIGURATION" --no-restore -- --export-openapi /tmp/notrelix.v1.json
          cmp contracts/openapi/notrelix.v1.json /tmp/notrelix.v1.json

  fast-checks-frontend:
    name: Fast checks (frontend ${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # typecheck alone is ~2 min, so it gets its own runner.
      matrix:
        check: [typecheck, rest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - if: matrix.check == 'typecheck'
        run: pnpm typecheck
      # Every light check runs and reports even when an earlier one fails.
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm format:check
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm lint
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm check:architecture
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm check:i18n
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm check:mock-consumer-surface
      - if: ${{ !cancelled() && matrix.check == 'rest' }}
        run: pnpm codegen:check

  # One verdict for every cheap check: any failure on either side keeps all heavy jobs from starting; a side with no changes is skipped and does not count.
  # Every heavy job below says !cancelled() and names its own side and this verdict: the implicit success() would also count the skipped fast check of the other side further up the chain and skip the job.
  fast-checks:
    name: Fast checks
    needs: [changes, fast-checks-backend, fast-checks-frontend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          check(){ # name result side-changed
            if [[ "$3" == true ]]; then [[ "$2" == success ]] || { echo "::error::$1=$2 but its side changed"; exit 1; }
            else [[ "$2" == skipped ]] || { echo "::error::$1=$2 but its side did not change"; exit 1; }; fi
          }
          [[ "${{ needs.changes.result }}" == success ]] || { echo "::error::changes=${{ needs.changes.result }}"; exit 1; }
          check fast-checks-backend "${{ needs.fast-checks-backend.result }}" "${{ needs.changes.outputs.backend }}"
          check fast-checks-frontend "${{ needs.fast-checks-frontend.result }}" "${{ needs.changes.outputs.frontend }}"

  # The only backend restore and build of the heavy jobs: the unit job and every integration shard unpack this output and run dotnet test --no-build --no-restore.
  backend-build:
    name: Backend build
    needs: [changes, fast-checks]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && needs.fast-checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      # Same key as the fast checks and as use-backend-build; the test jobs read what this job saves.
      - name: Restore NuGet packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore backend.slnx
      - run: dotnet build backend.slnx --no-restore --configuration "$DOTNET_CONFIGURATION"
      # bin and obj together: obj holds project.assets.json, which --no-restore needs. A tar keeps the paths and file modes that upload-artifact would drop.
      - name: Pack the build output
        run: |
          set -euo pipefail
          find . -type d \( -name bin -o -name obj \) -prune -print0 | tar --null -T - -cf - | gzip -1 > "$RUNNER_TEMP/backend-build.tgz"
          ls -lh "$RUNNER_TEMP/backend-build.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: ${{ runner.temp }}/backend-build.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # One runner per unit test project, all on the build above. The Architecture tests run in fast-checks-backend. fail-fast is off so every project reports even when another fails.
  backend-unit:
    name: Backend unit tests (${{ matrix.project }})
    needs: [changes, fast-checks, backend-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && needs.backend-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [Domain, Application, Infrastructure, Platform, API]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/use-backend-build
        with:
          restore-target: tests/Notrelix.${{ matrix.project }}.Tests/Notrelix.${{ matrix.project }}.Tests.csproj
      - name: ${{ matrix.project }} tests
        run: >
          dotnet test "tests/Notrelix.${{ matrix.project }}.Tests/Notrelix.${{ matrix.project }}.Tests.csproj"
          --no-build --no-restore --configuration "$DOTNET_CONFIGURATION" --blame-hang-timeout 5m
          --logger "trx;LogFileName=unit-${{ matrix.project }}.trx" --results-directory "$RUNNER_TEMP/trx"
      # Per-test durations, to split a project further by measured time if it becomes the long pole.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-trx-${{ matrix.project }}
          path: ${{ runner.temp }}/trx/*.trx
          if-no-files-found: warn
          retention-days: 7

  backend-integration:
    name: Integration tests (${{ matrix.shard.name }})
    needs: [changes, fast-checks, backend-build]
    if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' && needs.backend-build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The last shard is the complement of the others, so every test runs exactly once.
        shard:
          - name: workspaces
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Workspaces.
          - name: auth
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Auth.
          - name: work-management
            filter: FullyQualifiedName~Notrelix.Integration.Tests.WorkManagement.
          # The Rls classes run one after another, so they are split by measured time (trx of a CI run, see docs/delivery/ci-cd-architecture.md): rls-1 to rls-4 list their classes,
          # rls-rest is the exact complement (every other Rls class, including new ones). No class is in two shards and none is dropped.
          - name: rls-1
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Rls.AppRoleConformanceTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.PublicFormAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.AdminGrantWriteTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.WorkerPrincipalTests.
          - name: rls-2
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Rls.AccountSsoAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.UserScopeIsolationTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.AccountMfaPolicyAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.AccountSuspensionAppRoleTests.
          - name: rls-3
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Rls.CredentialScopeTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.ApiTokenCollaborationAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.SsoSignInAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.NonMemberDisclosureTests.
          - name: rls-4
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Rls.InvitationScopeTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.ApiTokenScopeTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.ApiTokenScopesAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.FormPublicAccessAppRoleTests.|FullyQualifiedName~Notrelix.Integration.Tests.Rls.AnalyticsReportNonMemberDisclosureTests.
          - name: rls-rest
            filter: FullyQualifiedName~Notrelix.Integration.Tests.Rls.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AppRoleConformanceTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.PublicFormAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AdminGrantWriteTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.WorkerPrincipalTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AccountSsoAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.UserScopeIsolationTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AccountMfaPolicyAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AccountSuspensionAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.CredentialScopeTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.ApiTokenCollaborationAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.SsoSignInAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.NonMemberDisclosureTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.InvitationScopeTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.ApiTokenScopeTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.ApiTokenScopesAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.FormPublicAccessAppRoleTests.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.AnalyticsReportNonMemberDisclosureTests.
          - name: rest
            filter: FullyQualifiedName!~Notrelix.Integration.Tests.Workspaces.&FullyQualifiedName!~Notrelix.Integration.Tests.Auth.&FullyQualifiedName!~Notrelix.Integration.Tests.WorkManagement.&FullyQualifiedName!~Notrelix.Integration.Tests.Rls.
    services:
      redis:
        image: redis@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false
      Cors__AllowedOrigins__0: http://localhost:5173
      ForwardedHeaders__RequireKnownProxyInProduction: "false"
      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: "60"
      JwtSettings__RefreshTokenExpireDays: "7"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/use-backend-build
        with:
          restore-target: tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
      - run: >
          dotnet test tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
          --no-build --no-restore --configuration "$DOTNET_CONFIGURATION" --blame-hang-timeout 5m
          --logger "trx;LogFileName=${{ matrix.shard.name }}.trx" --results-directory "$RUNNER_TEMP/trx"
          --filter "${{ matrix.shard.filter }}"
      # Per-test durations, so the shard split can be rebalanced by measured time (see docs/delivery/ci-cd-architecture.md).
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-trx-${{ matrix.shard.name }}
          path: ${{ runner.temp }}/trx/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend tests and build
    needs: [changes, fast-checks]
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' && needs.fast-checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      # test:node and the build both report even when the other fails.
      - if: ${{ !cancelled() }}
        run: pnpm test:node
      - if: ${{ !cancelled() }}
        run: pnpm --filter @notrelix/app-web build

  # The web component suite is the long pole, so vitest splits its files across shards; every file runs in exactly one shard.
  frontend-web:
    name: Frontend web tests (${{ matrix.shard }}/4)
    needs: [changes, fast-checks]
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' && needs.fast-checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:web --shard=${{ matrix.shard }}/4

  dependencies:
    name: Dependency audit
    uses: ./.github/workflows/security-ci.yml
    with:
      scan_backend: true
      scan_frontend: true

  ci-gate:
    name: CI gate
    needs: [changes, fast-checks, fast-checks-backend, fast-checks-frontend, backend-build, backend-unit, backend-integration, frontend, frontend-web, dependencies]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        run: |
          set -euo pipefail
          # skipped is allowed only when the path filter said the side did not change; a skip from a failed dependency fails the gate.
          check(){ # name result side-changed
            if [[ "$3" == true ]]; then [[ "$2" == success ]] || { echo "::error::$1=$2 but its side changed"; exit 1; }
            else [[ "$2" == skipped ]] || { echo "::error::$1=$2 but its side did not change"; exit 1; }; fi
          }
          [[ "${{ needs.changes.result }}" == success ]] || { echo "::error::changes=${{ needs.changes.result }}"; exit 1; }
          be="${{ needs.changes.outputs.backend }}"; fe="${{ needs.changes.outputs.frontend }}"
          [[ "${{ needs.fast-checks.result }}" == success ]] || { echo "::error::fast-checks=${{ needs.fast-checks.result }}"; exit 1; }
          check fast-checks-backend "${{ needs.fast-checks-backend.result }}" "$be"
          check backend-build "${{ needs.backend-build.result }}" "$be"
          check backend-unit "${{ needs.backend-unit.result }}" "$be"
          check backend-integration "${{ needs.backend-integration.result }}" "$be"
          check fast-checks-frontend "${{ needs.fast-checks-frontend.result }}" "$fe"
          check frontend "${{ needs.frontend.result }}" "$fe"
          check frontend-web "${{ needs.frontend-web.result }}" "$fe"
          [[ "${{ needs.dependencies.result }}" == success || "${{ needs.dependencies.result }}" == skipped ]] || { echo "::error::dependencies=${{ needs.dependencies.result }}"; exit 1; }

  # ---- Release candidate: release/** only, after the gate is green and only when the plan says release ----
  release-plan:
    name: Release plan
    needs: ci-gate
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && needs.ci-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_candidate: ${{ steps.plan.outputs.release_candidate }}
      container_matrix: ${{ steps.plan.outputs.container_matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -m tools.deliveryctl plan --event-name push --ref "$GITHUB_REF" --source-sha "$GITHUB_SHA" \
            --before-sha "$BEFORE" --output plan/plan.json --github-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan
          path: plan/plan.json
          if-no-files-found: error
          retention-days: 30

  release-images:
    name: Release images (amd64 and arm64)
    needs: release-plan
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.release-plan.outputs.release_candidate == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-ci.yml
    with:
      container_matrix: ${{ needs.release-plan.outputs.container_matrix }}
      source_sha: ${{ github.sha }}
      plan_sha256: ${{ needs.release-plan.outputs.plan_sha256 }}
      publish_mode: ${{ format('{0}', 'true') }}

  release-candidate:
    name: Build release candidate
    needs: [release-plan, release-images]
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.release-images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images_json: ${{ steps.build.outputs.images_json }}
      contract_json: ${{ steps.build.outputs.contract_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-plan, path: plan}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-image-manifests, path: release-images}
      - id: build
        env:
          PLAN_SHA256: ${{ needs.release-plan.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          # The single CI gate has already passed on this run, so the evidence is that statement, bound to the plan.
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg plan "$PLAN_SHA256" \
            '{api_version:"delivery.notrelix.dev/v1",kind:"EvidenceSummary",status:"passed",source_sha:$sha,plan_sha256:$plan,run_id:$run,basis:"CI gate passed on this run before images were published"}' > evidence-body.json
          jq --arg s "$(sha256sum < evidence-body.json | cut -d' ' -f1)" '.summary_sha256=$s' evidence-body.json > evidence-summary.json
          python3 -m tools.deliveryctl release-candidate --plan plan/plan.json --evidence-summary evidence-summary.json \
            --images-dir release-images --run-id "$GITHUB_RUN_ID" --output candidate/release-candidate.json
          { echo "images_json=$(jq -c '{images: .images}' candidate/release-candidate.json)"; echo "contract_json=$(jq -c .release_contract candidate/release-candidate.json)"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-draft
          path: candidate/release-candidate.json
          if-no-files-found: error
          retention-days: 30

  release-stack:
    name: Release stack on the published digests
    needs: [release-plan, release-candidate]
    if: ${{ !cancelled() && needs.release-plan.result == 'success' && needs.release-candidate.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/stack-smoke.yml
    with:
      release_images_json: ${{ needs.release-candidate.outputs.images_json }}
      release_contract_json: ${{ needs.release-candidate.outputs.contract_json }}
      plan_sha256: ${{ needs.release-plan.outputs.plan_sha256 }}

  release-seal:
    name: Attest release candidate
    needs: [release-candidate, release-stack]
    if: ${{ !cancelled() && needs.release-candidate.result == 'success' && needs.release-stack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: release-candidate-draft, path: candidate}
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with: {subject-path: candidate/release-candidate.json}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: candidate/release-candidate.json
          if-no-files-found: error
          retention-days: 90
