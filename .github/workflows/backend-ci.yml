name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha: {required: true, type: string}
      plan_sha256: {required: true, type: string}
      redis_image: {required: true, type: string}
      change_range_json: {required: true, type: string}
      schema_change: {required: true, type: string}

permissions:
  contents: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  FALLBACK_REDIS_REF: redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
  PROOF_REGISTRY: ${{ github.workspace }}/backend/tests/ci-proofs.json

jobs:
  changes:
    name: Change detection and selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend || steps.called.outputs.backend }}
      base_sha: ${{ steps.detect.outputs.base_sha || steps.called.outputs.base_sha }}
      head_sha: ${{ steps.detect.outputs.head_sha || steps.called.outputs.head_sha }}
      range_known: ${{ steps.detect.outputs.range_known || steps.called.outputs.range_known }}
      schema_change: ${{ steps.detect.outputs.schema_change || steps.called.outputs.schema_change }}
      redis_ref: ${{ steps.detect.outputs.redis_ref || steps.called.outputs.redis_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: called
        if: github.event_name == 'workflow_call'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RANGE: ${{ inputs.change_range_json }}
          SCHEMA_CHANGE: ${{ inputs.schema_change }}
          REDIS_REF: ${{ inputs.redis_image }}
        run: |
          set -euo pipefail
          base="$(jq -r '.base_sha // ""' <<<"$RANGE")"
          head="$(jq -r '.head_sha // ""' <<<"$RANGE")"
          full_ci="$(jq -r '.full_ci // false' <<<"$RANGE")"
          [[ -n "$base" ]] || base="$SOURCE_SHA"
          [[ -n "$head" ]] || head="$SOURCE_SHA"
          range_known=true
          [[ "$full_ci" == true || -z "$base" || -z "$head" ]] && range_known=false
          {
            echo "backend=true"
            echo "base_sha=$base"
            echo "head_sha=$head"
            echo "range_known=$range_known"
            echo "schema_change=$SCHEMA_CHANGE"
            echo "redis_ref=$REDIS_REF"
          } >> "$GITHUB_OUTPUT"
      - id: detect
        if: github.event_name != 'workflow_call'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          selected=false
          base="$BASE_SHA"; head="$HEAD_SHA"
          range_known=false
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] && merge_base="$(git merge-base "$base" "$head" 2>/dev/null || true)" && [[ -n "$merge_base" ]]; then
                base="$merge_base"
                range_known=true
              else
                selected=true
              fi
              ;;
            push)
              head="$GITHUB_SHA"; base="$BEFORE_SHA"
              if [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then range_known=true; else selected=true; fi
              ;;
            *)
              selected=true
              ;;
          esac
          if [[ "$selected" == true ]] || ! files="$(git diff --name-only --diff-filter=ACMRDTUXB "$base" "$head" 2>/dev/null)"; then
            selected=true
          else
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                *.md) ;;
                backend/*) selected=true ;;
                .github/workflows/backend-ci.yml) selected=true ;;
                .github/actions/setup-backend/*) selected=true ;;
                scripts/ci/check-migration-discipline.py) selected=true ;;
                scripts/ci/verify-required-proofs-trx.py) selected=true ;;
              esac
              [[ "$selected" == true ]] && break
            done <<< "$files"
          fi
          {
            echo "backend=$selected"
            echo "base_sha=$base"
            echo "head_sha=$head"
            echo "range_known=$([[ "$selected" == true ]] && echo false || echo "$range_known")"
            echo "schema_change=false"
            echo "redis_ref=$FALLBACK_REDIS_REF"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight and static guards
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-backend
      - name: Restore
        working-directory: backend
        run: dotnet restore backend.slnx
      - name: Format check
        working-directory: backend
        run: dotnet format backend.slnx --verify-no-changes --no-restore
      - name: Build solution
        working-directory: backend
        run: dotnet build backend.slnx --no-restore --configuration "$DOTNET_CONFIGURATION" -p:ContinuousIntegrationBuild=true
      - name: Enforce append-only migration history
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          HEAD_SHA: ${{ needs.changes.outputs.head_sha }}
          RANGE_FLAGS: ${{ needs.changes.outputs.range_known == 'true' && '' || '--full-range' }} ${{ needs.changes.outputs.schema_change == 'true' && '--schema-change' || '' }}
        run: |
          read -r -a flags <<<"$RANGE_FLAGS"
          python3 scripts/ci/check-migration-discipline.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" "${flags[@]}"
      - name: Guard dependency graph against SQLite
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet list package --include-transitive 2>&1 | tee dependency-report.txt
          if grep -iE 'SQLite|Sqlite|SQLitePCLRaw|Microsoft\.Data\.Sqlite|Microsoft\.EntityFrameworkCore\.Sqlite' dependency-report.txt; then
            echo "SQLite dependency detected; use PostgreSQL/Testcontainers." >&2
            exit 1
          fi
      - name: Guard source against SQLite usage
        working-directory: backend
        run: |
          set -euo pipefail
          matches="$(grep -RInE 'UseSqlite|SqliteConnection|Microsoft\.EntityFrameworkCore\.Sqlite|Microsoft\.Data\.Sqlite|SQLitePCLRaw|DataSource=:memory:' src tests Directory.Packages.props --include='*.cs' --include='*.csproj' --include='*.props' --exclude='DatabaseProviderArchitectureTests.cs' || true)"
          [[ -z "$matches" ]] || { printf '%s\n' "$matches"; exit 1; }

  architecture-core:
    name: Architecture and core tests
    needs: [changes, preflight]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: Architecture tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Architecture.Tests/Notrelix.Architecture.Tests.csproj
          dotnet test tests/Notrelix.Architecture.Tests/Notrelix.Architecture.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=architecture.trx" --results-directory TestResults/architecture --blame-hang-timeout 5m
      - name: Verify architecture proof profile
        working-directory: backend
        run: >
          python3 ../scripts/ci/verify-required-proofs-trx.py
          --registry "$PROOF_REGISTRY" --profile architecture
          --trx TestResults/architecture/architecture.trx
      - name: Domain tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Domain.Tests/Notrelix.Domain.Tests.csproj
          dotnet test tests/Notrelix.Domain.Tests/Notrelix.Domain.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=domain.trx" --results-directory TestResults/domain --blame-hang-timeout 5m
          git diff --exit-code -- tests/Notrelix.Domain.Tests/Snapshots
      - name: Application tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Application.Tests/Notrelix.Application.Tests.csproj
          dotnet test tests/Notrelix.Application.Tests/Notrelix.Application.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=application.trx" --results-directory TestResults/application --blame-hang-timeout 5m
      - name: Infrastructure tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Infrastructure.Tests/Notrelix.Infrastructure.Tests.csproj
          dotnet test tests/Notrelix.Infrastructure.Tests/Notrelix.Infrastructure.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=infrastructure.trx" --results-directory TestResults/infrastructure --blame-hang-timeout 5m
      - name: Verify core proof profile
        working-directory: backend
        run: >
          python3 ../scripts/ci/verify-required-proofs-trx.py
          --registry "$PROOF_REGISTRY" --profile core
          --trx TestResults/infrastructure/infrastructure.trx
      - name: Upload architecture and core test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-architecture-core-test-results
          path: backend/TestResults
          if-no-files-found: ignore
          retention-days: 7

  api-integration:
    name: API, platform and integration tests
    needs: [changes, preflight]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      redis:
        image: ${{ needs.changes.outputs.redis_ref }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      ConnectionStrings__Redis: localhost:6379,abortConnect=false
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:3000
      ForwardedHeaders__RequireKnownProxyInProduction: "false"
      JwtSettings__SecretKey: ci-test-secret-key-must-be-at-least-32-characters
      JwtSettings__Issuer: Notrelix.CI
      JwtSettings__Audience: Notrelix.CI
      JwtSettings__ExpireMinutes: "60"
      JwtSettings__RefreshTokenExpireDays: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: Platform messaging tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Platform.Tests/Notrelix.Platform.Tests.csproj
          dotnet test tests/Notrelix.Platform.Tests/Notrelix.Platform.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=platform.trx" --results-directory TestResults/platform --blame-hang-timeout 5m
      - name: Verify platform proof profile
        working-directory: backend
        run: >
          python3 ../scripts/ci/verify-required-proofs-trx.py
          --registry "$PROOF_REGISTRY" --profile platform
          --trx TestResults/platform/platform.trx
      - name: API tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.API.Tests/Notrelix.API.Tests.csproj
          dotnet test tests/Notrelix.API.Tests/Notrelix.API.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=api.trx" --results-directory TestResults/api --blame-hang-timeout 5m
      - name: Verify api proof profile
        working-directory: backend
        run: >
          python3 ../scripts/ci/verify-required-proofs-trx.py
          --registry "$PROOF_REGISTRY" --profile api
          --trx TestResults/api/api.trx
      - name: Export OpenAPI spec and verify no drift
        working-directory: backend
        env:
          DOTNET_ENVIRONMENT: Development
          Messaging__Transport: InMemory
          Database__MigrateOnStartup: "false"
          SeedData__RunOnStartup: "false"
        run: |
          set -euo pipefail
          contract="$GITHUB_WORKSPACE/backend/contracts/openapi/notrelix.v1.json"
          test -f "$contract"
          git ls-files --error-unmatch "$contract"
          dotnet run --project src/Notrelix.API/Notrelix.API.csproj --configuration "$DOTNET_CONFIGURATION" --no-build -- --export-openapi /tmp/notrelix.v1.generated.json
          cmp "$contract" /tmp/notrelix.v1.generated.json
      - name: Integration and provider tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj
          dotnet test tests/Notrelix.Integration.Tests/Notrelix.Integration.Tests.csproj --no-restore --configuration "$DOTNET_CONFIGURATION" --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration --blame-hang-timeout 5m
      - name: Verify integration proof profile
        working-directory: backend
        run: >
          python3 ../scripts/ci/verify-required-proofs-trx.py
          --registry "$PROOF_REGISTRY" --profile integration
          --trx TestResults/integration/integration.trx
      - name: Upload API, platform and integration evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-api-integration-test-results
          path: backend/TestResults
          if-no-files-found: ignore
          retention-days: 7

  proof:
    name: Backend CI gate
    if: always()
    needs: [changes, preflight, architecture-core, api-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require backend proof when selected
        env:
          SELECTED: ${{ needs.changes.outputs.backend }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          allowed_unselected(){ local name="$1" result="$2"; [[ "$result" == skipped || "$result" == success ]] || { echo "::error::$name unexpected result=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require changes "$(result changes)"
          if [[ "$SELECTED" == true ]]; then
            require preflight "$(result preflight)"
            require architecture-core "$(result architecture-core)"
            require api-integration "$(result api-integration)"
          else
            for j in preflight architecture-core api-integration; do
              allowed_unselected "$j" "$(result "$j")"
            done
          fi
      - if: github.event_name == 'workflow_call'
        uses: ./.github/actions/emit-evidence
        with:
          proof_id: 'backend:backend-api'
          component_id: backend-api
          plan_sha256: ${{ inputs.plan_sha256 }}
          source_sha: ${{ inputs.source_sha }}
