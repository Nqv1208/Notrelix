name: Dependency Security CI
on:
  workflow_call:
    inputs:
      scan_backend: {required: false, type: boolean, default: false}
      scan_frontend: {required: false, type: boolean, default: false}
permissions:
  contents: read
jobs:
  backend-dependencies:
    name: Backend dependency vulnerabilities
    if: inputs.scan_backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - working-directory: backend
        run: dotnet restore backend.slnx
      - name: Fail on vulnerable NuGet packages
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable-report.txt
          if grep -q "has the following vulnerable packages" vulnerable-report.txt; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: backend-vulnerability-report, path: backend/vulnerable-report.txt, if-no-files-found: ignore, retention-days: 14}
      - uses: ./.github/actions/emit-evidence
        with: {proof_id: 'security:backend', component_id: backend-dependencies}
  frontend-dependencies:
    name: Frontend dependency vulnerabilities
    if: inputs.scan_frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: |
          set -o pipefail
          pnpm audit --audit-level high 2>&1 | tee pnpm-audit.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: frontend-vulnerability-report, path: frontend/pnpm-audit.txt, if-no-files-found: ignore, retention-days: 14}
      - uses: ./.github/actions/emit-evidence
        with: {proof_id: 'security:frontend', component_id: frontend-dependencies}
  gate:
    name: Dependency Security CI gate
    if: always()
    needs: [backend-dependencies, frontend-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require selected dependency scans
        env:
          SCAN_BACKEND: ${{ inputs.scan_backend }}
          SCAN_FRONTEND: ${{ inputs.scan_frontend }}
          BACKEND_RESULT: ${{ needs.backend-dependencies.result }}
          FRONTEND_RESULT: ${{ needs.frontend-dependencies.result }}
        run: |
          set -euo pipefail
          check(){
            local enabled="$1" result="$2" name="$3"
            if [[ "$enabled" == true ]]; then
              [[ "$result" == success ]] || { echo "$name required but result=$result" >&2; exit 1; }
            else
              [[ "$result" == skipped || "$result" == success ]] || { echo "$name unexpected result=$result" >&2; exit 1; }
            fi
          }
          check "$SCAN_BACKEND" "$BACKEND_RESULT" backend
          check "$SCAN_FRONTEND" "$FRONTEND_RESULT" frontend
