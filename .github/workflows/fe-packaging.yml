name: Frontend Packaging

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/Dockerfile"
      - "frontend/Dockerfile.marketing"
      - "frontend/apps/web/**"
      - "frontend/apps/marketing/**"
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/.npmrc"
      - "frontend/turbo.json"
      - ".dockerignore"
      - ".github/workflows/fe-packaging.yml"
  push:
    branches: [main, develop]
    paths:
      - "frontend/Dockerfile"
      - "frontend/Dockerfile.marketing"
      - "frontend/apps/web/**"
      - "frontend/apps/marketing/**"
      - "frontend/packages/**"
      - "frontend/tooling/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "frontend/.npmrc"
      - "frontend/turbo.json"
      - ".dockerignore"
      - ".github/workflows/fe-packaging.yml"

permissions:
  contents: read

concurrency:
  group: frontend-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    name: Container smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            dockerfile: frontend/Dockerfile
            image: notrelix-web:ci
          - target: marketing
            dockerfile: frontend/Dockerfile.marketing
            image: notrelix-marketing:ci

    steps:
      - uses: actions/checkout@v4

      - name: Build production container
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .
