name: PgBouncer Runtime Image

# Builds the derived, security-patched pgbouncer runtime image (infra/pgbouncer/Dockerfile: the pinned
# upstream digest plus `apk upgrade`), proves the runtime contract equals the base image, gates it with
# Trivy WITHOUT any ignore file, and on trusted main publishes + attests it to GHCR as a linux/amd64 +
# linux/arm64 index (each arch built natively). The published digest is then pinned in
# delivery/images.lock.toml ([images.pgbouncer].ref). This workflow never edits the lock; a reviewed commit does.

on:
  pull_request:
    branches: [main, develop, 'release/**']
    paths:
      - infra/pgbouncer/Dockerfile
      - .github/workflows/pgbouncer-image.yml
  push:
    branches: [main]
    paths:
      - infra/pgbouncer/Dockerfile
      - .github/workflows/pgbouncer-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notrelix-pgbouncer-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_SEVERITY: CRITICAL,HIGH
  IMAGE_NAME: notrelix-pgbouncer

jobs:
  build:
    name: Build, prove and scan derived pgbouncer image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      IMAGE: notrelix-ci/pgbouncer:${{ github.sha }}-${{ matrix.arch }}
      TRIVY_SECRET_CONFIG: .github/security/trivy-secret.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build derived image from the pinned Dockerfile
        run: docker build -f infra/pgbouncer/Dockerfile -t "$IMAGE" infra/pgbouncer
      - name: Prove the runtime contract equals the base image
        run: |
          set -euo pipefail
          base="$(sed -n 's/^ARG PGBOUNCER_BASE=//p' infra/pgbouncer/Dockerfile)"
          [[ "$base" =~ ^edoburu/pgbouncer@sha256:[0-9a-f]{64}$ ]] || { echo "::error::PGBOUNCER_BASE is not a pinned upstream digest: $base"; exit 1; }
          docker pull --quiet "$base" >/dev/null
          contract='{entrypoint:.Config.Entrypoint,cmd:.Config.Cmd,user:.Config.User,workdir:.Config.WorkingDir,ports:.Config.ExposedPorts,volumes:.Config.Volumes,stopsignal:.Config.StopSignal}'
          diff <(docker image inspect "$base" | jq -S ".[0]|$contract") <(docker image inspect "$IMAGE" | jq -S ".[0]|$contract")
      - name: Run Trivy vulnerability scan (no ignore file)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Verify pgbouncer starts
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pgbouncer "$IMAGE" --version
      - name: Save validated image for trusted publish
        if: github.event_name != 'pull_request'
        run: docker save -o "$GITHUB_WORKSPACE/release-image-pgbouncer-${{ matrix.arch }}.tar" "$IMAGE"
      - name: Upload validated image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-pgbouncer-${{ matrix.arch }}
          path: release-image-pgbouncer-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Trusted-main publication of the derived pgbouncer image
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'release-image-pgbouncer-*', merge-multiple: true, path: images}
      - name: Authenticate to GHCR
        env: {GHCR_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish exact validated bytes
        id: publish
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/${IMAGE_NAME}"
          refs=()
          for arch in amd64 arm64; do
            docker load -i "images/release-image-pgbouncer-${arch}.tar"
            tag="${repo}:${GITHUB_SHA}-${arch}"
            docker tag "notrelix-ci/pgbouncer:${GITHUB_SHA}-${arch}" "$tag"
            docker push "$tag" >/dev/null
            d="$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -o 'sha256:[a-f0-9]*' | head -1)"
            [[ -n "$d" ]]
            refs+=("${repo}@${d}")
          done
          docker buildx imagetools create -t "${repo}:${GITHUB_SHA}" "${refs[@]}"
          digest="$(docker buildx imagetools inspect "${repo}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          platforms="$(docker buildx imagetools inspect "${repo}@${digest}" --raw | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')"
          [[ "$platforms" == "linux/amd64,linux/arm64" ]] || { echo "::error::index platforms=$platforms"; exit 1; }
          printf 'subject_name=%s\n' "ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          printf 'subject_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Derived pgbouncer image published'
            echo
            echo "Pin this in delivery/images.lock.toml, section images.pgbouncer, field ref (reviewed commit, lowercase):"
            echo
            echo '```'
            echo "ghcr.io/${owner}/${IMAGE_NAME}@${digest}"
            echo '```'
            echo
            echo 'This is the amd64 + arm64 index digest. Nothing re-pins automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest derived pgbouncer image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.subject_name }}
          subject-digest: ${{ steps.publish.outputs.subject_digest }}
          push-to-registry: true
          create-storage-record: false
