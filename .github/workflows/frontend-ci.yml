name: Frontend CI
on:
  workflow_call:
    inputs:
      host_matrix_json: {required: true, type: string}
      host_count: {required: true, type: number}
      mobile_matrix_json: {required: true, type: string}
      mobile_count: {required: true, type: number}
      filters_json: {required: true, type: string}
      capabilities_json: {required: true, type: string}
      renderer_ref: {required: true, type: string}
      renderer_version: {required: true, type: string}
      mock_artifact_component: {required: false, type: string, default: ""}
      mock_artifact_name: {required: false, type: string, default: ""}
      mock_archive_file: {required: false, type: string, default: ""}
      mock_manifest_file: {required: false, type: string, default: ""}
permissions: {contents: read}
defaults:
  run: {shell: bash, working-directory: frontend}
env:
  CI: "1"
  VITE_API_URL: https://api.example.invalid/api/v1
  VITE_WS_URL: wss://api.example.invalid/realtime
  VITE_APP_URL: http://127.0.0.1:4173
  VITE_RELEASE_SHA: ${{ github.sha }}
  VITE_MOCK_API: "false"
  EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
  EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/realtime
  EXPO_PUBLIC_APP_URL: https://app.example.invalid
  EXPO_PUBLIC_RELEASE_SHA: ${{ github.sha }}
  MARKETING_E2E_REUSE_BUILD: "1"
jobs:
  invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm codegen:check
      - run: pnpm check:architecture
      - run: pnpm check:architecture-docs
      - run: pnpm check:test-taxonomy
      - run: pnpm check:lint-coverage
      - run: pnpm format:check
  affected-static:
    needs: invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - env: {FILTERS_JSON: '${{ inputs.filters_json }}'}
        run: |
          mapfile -t selected < <(jq -r '.[]' <<<"$FILTERS_JSON"); [[ ${#selected[@]} -gt 0 ]]
          filters=(); for item in "${selected[@]}"; do filters+=("--filter=$item"); done
          pnpm exec turbo run typecheck lint "${filters[@]}"
  node-tests:
    needs: affected-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:node:guarded
  web-tests:
    needs: affected-static
    if: contains(fromJSON(inputs.capabilities_json), 'web-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:web:guarded
      - run: pnpm test:integration:guarded
  mobile-tests:
    needs: affected-static
    if: inputs.mobile_count > 0 || contains(fromJSON(inputs.capabilities_json), 'mobile-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:mobile:guarded
  tooling-tests:
    needs: affected-static
    if: contains(fromJSON(inputs.capabilities_json), 'tooling-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:generators:guarded
  ui-foundation:
    needs: affected-static
    if: contains(fromJSON(inputs.capabilities_json), 'ui')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ${{ inputs.renderer_ref }}
      env: {PLAYWRIGHT_BROWSERS_PATH: /ms-playwright}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Renderer/package version contract
        run: |
          actual="$(pnpm exec playwright --version | awk '{print $2}')"; [[ "$actual" == "${{ inputs.renderer_version }}" ]]
      - run: pnpm test:ui:freeze
      - uses: ./.github/actions/emit-evidence
        with: {proof_id: 'ui:foundation', component_id: frontend-ui}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: ui-playwright-report, path: frontend/playwright-report-ui, if-no-files-found: ignore, retention-days: 7}
  host-build:
    if: inputs.host_count > 0
    needs: affected-static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.host_matrix_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - env: {WORKSPACE: '${{ matrix.workspace }}', BUILD_SCRIPT: '${{ matrix.build_script }}'}
        run: pnpm --filter "$WORKSPACE" run "$BUILD_SCRIPT"
      - env:
          COMPONENT: ${{ matrix.component_id }}
          PATHS_JSON: ${{ matrix.artifact_paths_json }}
          ARCHIVE: ${{ matrix.archive_file }}
          MANIFEST: ${{ matrix.manifest_file }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/frontend"
          node scripts/ci/package-host-artifact.mjs --component "$COMPONENT" --paths-json "$PATHS_JSON" --output "$GITHUB_WORKSPACE/artifacts/frontend/$ARCHIVE" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/$MANIFEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            artifacts/frontend/${{ matrix.archive_file }}
            artifacts/frontend/${{ matrix.manifest_file }}
          if-no-files-found: error
          retention-days: 1
  host-e2e:
    if: inputs.host_count > 0
    needs: host-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.host_matrix_json) }}
    container:
      image: ${{ inputs.renderer_ref }}
      env: {PLAYWRIGHT_BROWSERS_PATH: /ms-playwright}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: '${{ matrix.artifact_name }}', path: 'artifacts/frontend/${{ matrix.component_id }}'}
      - env: {COMPONENT: '${{ matrix.component_id }}', ARCHIVE: '${{ matrix.archive_file }}', MANIFEST: '${{ matrix.manifest_file }}'}
        run: node scripts/ci/restore-host-artifact.mjs --component "$COMPONENT" --archive "$GITHUB_WORKSPACE/artifacts/frontend/$COMPONENT/$ARCHIVE" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/$COMPONENT/$MANIFEST" --destination "$GITHUB_WORKSPACE/frontend"
      - run: 'actual="$(pnpm exec playwright --version | awk ''{print $2}'')"; [[ "$actual" == "${{ inputs.renderer_version }}" ]]'
      - env: {E2E_SCRIPT: '${{ matrix.e2e_script }}'}
        run: pnpm run "$E2E_SCRIPT"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'host-e2e-${{ matrix.component_id }}', path: 'frontend/playwright-report*\nfrontend/test-results', if-no-files-found: ignore, retention-days: 7}
  mobile-build:
    if: inputs.mobile_count > 0
    needs: affected-static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy: {fail-fast: false, matrix: '${{ fromJSON(inputs.mobile_matrix_json) }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - env: {WORKSPACE: '${{ matrix.workspace }}', BUILD_SCRIPT: '${{ matrix.build_script }}'}
        run: pnpm --filter "$WORKSPACE" run "$BUILD_SCRIPT"
  mock-contract:
    needs: affected-static
    if: contains(fromJSON(inputs.capabilities_json), 'mock')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm mock:contract
  mock-e2e:
    needs: affected-static
    if: contains(fromJSON(inputs.capabilities_json), 'mock')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persona: [owner, admin, member, viewer]
        state: [default, new-user, empty-workspace, permission-limited, expired-session]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: frontend
        env: {VITE_MOCK_PERSONA: '${{ matrix.persona }}', VITE_MOCK_STATE: '${{ matrix.state }}'}
        run: pnpm e2e:mock
      - working-directory: frontend
        run: pnpm e2e:mock:count
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'mock-e2e-${{ matrix.persona }}-${{ matrix.state }}', path: frontend/playwright-report, if-no-files-found: ignore, retention-days: 7}
  mock-artifact-isolation:
    needs: host-build
    if: contains(fromJSON(inputs.capabilities_json), 'mock')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: '${{ inputs.mock_artifact_name }}', path: artifacts/frontend/mock}
      - env: {COMPONENT: '${{ inputs.mock_artifact_component }}', ARCHIVE: '${{ inputs.mock_archive_file }}', MANIFEST: '${{ inputs.mock_manifest_file }}'}
        run: node scripts/ci/restore-host-artifact.mjs --component "$COMPONENT" --archive "$GITHUB_WORKSPACE/artifacts/frontend/mock/$ARCHIVE" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/mock/$MANIFEST" --destination "$GITHUB_WORKSPACE/frontend"
      - run: pnpm check:production-mock-isolation
  gate:
    name: Frontend gate
    if: always()
    needs: [invariants, affected-static, node-tests, web-tests, mobile-tests, tooling-tests, ui-foundation, host-build, host-e2e, mobile-build, mock-contract, mock-e2e, mock-artifact-isolation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: {run: {shell: bash, working-directory: .}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          RESULTS: ${{ toJSON(needs) }}
          CAPS: ${{ inputs.capabilities_json }}
          HOST_COUNT: ${{ inputs.host_count }}
          MOBILE_COUNT: ${{ inputs.mobile_count }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require invariants "$(result invariants)"
          require static "$(result affected-static)"
          require node "$(result node-tests)"
          has(){ jq -e --arg x "$1" 'index($x)!=null' <<<"$CAPS" >/dev/null; }
          if has web-tests; then require web "$(result web-tests)"; fi
          if [[ "$MOBILE_COUNT" -gt 0 ]] || has mobile-tests; then require mobile "$(result mobile-tests)"; fi
          if has tooling-tests; then require tooling "$(result tooling-tests)"; fi
          if has ui; then require ui "$(result ui-foundation)"; fi
          if [[ "$HOST_COUNT" -gt 0 ]]; then
            require host-build "$(result host-build)"
            require host-e2e "$(result host-e2e)"
          fi
          if [[ "$MOBILE_COUNT" -gt 0 ]]; then require mobile-build "$(result mobile-build)"; fi
          if has mock; then
            require mock-contract "$(result mock-contract)"
            require mock-e2e "$(result mock-e2e)"
            require mock-isolation "$(result mock-artifact-isolation)"
          fi
      - uses: ./.github/actions/emit-evidence
        with: {proof_id: 'frontend:gate', component_id: frontend}
