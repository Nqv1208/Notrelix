name: Frontend CI
on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions: {contents: read}
defaults:
  run: {shell: bash, working-directory: frontend}
env:
  CI: "1"
  VITE_API_URL: https://api.example.invalid/api/v1
  VITE_WS_URL: wss://api.example.invalid/realtime
  VITE_APP_URL: http://127.0.0.1:4173
  VITE_RELEASE_SHA: ${{ github.sha }}
  VITE_MOCK_API: "false"
  EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
  EXPO_PUBLIC_REALTIME_URL: wss://api.example.invalid/realtime
  EXPO_PUBLIC_APP_URL: https://app.example.invalid
  EXPO_PUBLIC_RELEASE_SHA: ${{ github.sha }}
  MARKETING_E2E_REUSE_BUILD: "1"
jobs:
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          selected=false
          base="$BASE_SHA"; head="$HEAD_SHA"
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] && merge_base="$(git merge-base "$base" "$head" 2>/dev/null || true)" && [[ -n "$merge_base" ]]; then
                base="$merge_base"
              else
                selected=true
              fi
              ;;
            push)
              head="$GITHUB_SHA"; base="$BEFORE_SHA"
              if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then selected=true; fi
              ;;
            *)
              selected=true
              ;;
          esac
          if [[ "$selected" == true ]] || ! files="$(git diff --name-only --diff-filter=ACMRDTUXB "$base" "$head" 2>/dev/null)"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              *.md) ;;
              frontend/*) selected=true ;;
              backend/contracts/openapi/*) selected=true ;;
              artifacts/contracts/*) selected=true ;;
              .github/workflows/frontend-ci.yml) selected=true ;;
              .github/actions/setup-frontend/*) selected=true ;;
            esac
            [[ "$selected" == true ]] && break
          done <<< "$files"
          echo "frontend=$selected" >> "$GITHUB_OUTPUT"

  quality:
    name: Repository invariants and static checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm codegen:check
      - run: pnpm check:architecture
      - run: pnpm check:architecture-docs
      - run: pnpm check:test-taxonomy
      - run: pnpm check:lint-coverage
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint

  node-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:node:guarded

  web-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:web:guarded
      - run: pnpm test:integration:guarded

  mobile-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:mobile:guarded

  tooling-tests:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm test:generators:guarded

  ui-foundation:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:freeze
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: ui-playwright-report, path: frontend/playwright-report-ui, if-no-files-found: ignore, retention-days: 7}

  build-web:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm --filter @notrelix/app-web build
      - name: Package exact web artifact
        env:
          COMPONENT: web
          PATHS_JSON: '["apps/web/dist"]'
          ARCHIVE: web.tar.gz
          MANIFEST: web.manifest.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/frontend"
          node scripts/ci/package-host-artifact.mjs --component "$COMPONENT" --paths-json "$PATHS_JSON" --output "$GITHUB_WORKSPACE/artifacts/frontend/$ARCHIVE" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/$MANIFEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-host-build-web
          path: |
            artifacts/frontend/web.tar.gz
            artifacts/frontend/web.manifest.json
          if-no-files-found: error
          retention-days: 1

  web-e2e:
    needs: build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: frontend-host-build-web, path: artifacts/frontend/web}
      - name: Restore exact web artifact
        run: node scripts/ci/restore-host-artifact.mjs --component web --archive "$GITHUB_WORKSPACE/artifacts/frontend/web/web.tar.gz" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/web/web.manifest.json" --destination "$GITHUB_WORKSPACE/frontend"
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  build-marketing:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm --filter @notrelix/app-marketing build
      - name: Package exact marketing artifact
        env:
          COMPONENT: marketing
          PATHS_JSON: '["apps/marketing/.next/standalone","apps/marketing/.next/static","apps/marketing/public"]'
          ARCHIVE: marketing.tar.gz
          MANIFEST: marketing.manifest.json
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/frontend"
          node scripts/ci/package-host-artifact.mjs --component "$COMPONENT" --paths-json "$PATHS_JSON" --output "$GITHUB_WORKSPACE/artifacts/frontend/$ARCHIVE" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/$MANIFEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-host-build-marketing
          path: |
            artifacts/frontend/marketing.tar.gz
            artifacts/frontend/marketing.manifest.json
          if-no-files-found: error
          retention-days: 1

  marketing-e2e:
    needs: build-marketing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: frontend-host-build-marketing, path: artifacts/frontend/marketing}
      - name: Restore exact marketing artifact
        run: node scripts/ci/restore-host-artifact.mjs --component marketing --archive "$GITHUB_WORKSPACE/artifacts/frontend/marketing/marketing.tar.gz" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/marketing/marketing.manifest.json" --destination "$GITHUB_WORKSPACE/frontend"
      - run: pnpm e2e:marketing
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketing-e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  build-mobile:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm --filter @notrelix/app-mobile build

  mock-contract:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm mock:contract

  mock-e2e:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persona: [owner, admin, member, viewer]
        state: [default, new-user, empty-workspace, permission-limited, expired-session]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: pnpm exec playwright install --with-deps chromium
      - env: {VITE_MOCK_PERSONA: '${{ matrix.persona }}', VITE_MOCK_STATE: '${{ matrix.state }}'}
        run: pnpm e2e:mock
      - run: pnpm e2e:mock:count
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'mock-e2e-${{ matrix.persona }}-${{ matrix.state }}', path: frontend/playwright-report, if-no-files-found: ignore, retention-days: 7}

  mock-artifact-isolation:
    needs: build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: frontend-host-build-web, path: artifacts/frontend/mock}
      - name: Restore exact web artifact
        run: node scripts/ci/restore-host-artifact.mjs --component web --archive "$GITHUB_WORKSPACE/artifacts/frontend/mock/web.tar.gz" --manifest "$GITHUB_WORKSPACE/artifacts/frontend/mock/web.manifest.json" --destination "$GITHUB_WORKSPACE/frontend"
      - run: pnpm check:production-mock-isolation

  dependency-security:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: |
          set -o pipefail
          pnpm audit --audit-level high 2>&1 | tee pnpm-audit.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: frontend-pnpm-audit, path: frontend/pnpm-audit.txt, if-no-files-found: ignore, retention-days: 14}

  frontend-gate:
    name: Frontend gate
    if: always()
    needs: [changes, quality, node-tests, web-tests, mobile-tests, tooling-tests, ui-foundation, build-web, web-e2e, build-marketing, marketing-e2e, build-mobile, mock-contract, mock-e2e, mock-artifact-isolation, dependency-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults: {run: {shell: bash, working-directory: .}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require frontend proof when selected
        env:
          SELECTED: ${{ needs.changes.outputs.frontend }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require changes "$(result changes)"
          if [[ "$SELECTED" == true ]]; then
            for job in quality node-tests web-tests mobile-tests tooling-tests ui-foundation build-web web-e2e build-marketing marketing-e2e build-mobile mock-contract mock-e2e mock-artifact-isolation dependency-security; do
              require "$job" "$(result "$job")"
            done
          fi