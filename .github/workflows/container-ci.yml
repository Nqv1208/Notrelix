name: Container CI

on:
  pull_request:
    branches: [main, develop]
  merge_group:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  changes:
    name: Change detection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      web: ${{ steps.detect.outputs.web }}
      marketing: ${{ steps.detect.outputs.marketing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          backend=false; web=false; marketing=false; forced_all=false
          base="$BASE_SHA"; head="$HEAD_SHA"
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] && merge_base="$(git merge-base "$base" "$head" 2>/dev/null || true)" && [[ -n "$merge_base" ]]; then
                base="$merge_base"
              fi
              ;;
            push)
              head="$GITHUB_SHA"; base="$BEFORE_SHA"
              ;;
            *)
              forced_all=true
              ;;
          esac
          if [[ "$forced_all" == true ]]; then
            backend=true; web=true; marketing=true
          elif files="$(git diff --name-only --diff-filter=ACMRDTUXB "$base" "$head" 2>/dev/null)"; then
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                *.md) ;;
                backend/*) backend=true ;;
                frontend/Dockerfile|frontend/Dockerfile.marketing) web=true; marketing=true ;;
                frontend/apps/web/**) web=true ;;
                frontend/packages/**|frontend/tooling/**) web=true; marketing=true ;;
                frontend/package.json|frontend/pnpm-lock.yaml|frontend/pnpm-workspace.yaml|frontend/.npmrc|frontend/turbo.json) web=true; marketing=true ;;
                .dockerignore|.github/workflows/container-ci.yml) backend=true; web=true; marketing=true ;;
              esac
            done <<< "$files"
          fi
          {
            echo "backend=$backend"
            echo "web=$web"
            echo "marketing=$marketing"
          } >> "$GITHUB_OUTPUT"

  backend-image:
    name: Backend image validation
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build --pull=false -f backend/Dockerfile -t notrelix-ci/backend:${{ github.sha }} backend
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/backend:${{ github.sha }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Export SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/backend:${{ github.sha }}
          format: spdx-json
          output: backend.sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-backend-sbom
          path: backend.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify runtime health with publish dependencies
        run: |
          set -euo pipefail
          network="notrelix-ci-backend-${{ github.run_id }}"
          creds="$(mktemp)"
          docker network create "$network"
          cleanup(){ rm -f "$creds"; docker rm -f notrelix-ci-backend-http notrelix-ci-rabbitmq notrelix-ci-redis notrelix-ci-postgres >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name notrelix-ci-postgres --network "$network" -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=notrelix postgres:16-alpine >/dev/null
          docker run -d --name notrelix-ci-redis --network "$network" redis:7-alpine redis-server --requirepass ci >/dev/null
          docker run -d --name notrelix-ci-rabbitmq --network "$network" -e RABBITMQ_DEFAULT_USER=rabbitmq -e RABBITMQ_DEFAULT_PASS=ci rabbitmq:3.13-management-alpine >/dev/null
          for _ in $(seq 1 45); do docker exec notrelix-ci-postgres pg_isready -U postgres -d notrelix >/dev/null 2>&1 && break; sleep 1; done
          for _ in $(seq 1 60); do docker exec notrelix-ci-rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1 && break; sleep 1; done
          scripts/ci/generate-test-credentials.sh > "$creds"
          # shellcheck source=/dev/null
          source "$creds"
          docker run -d --name notrelix-ci-backend-http -p 8080:8080 --network "$network" \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e HttpsRedirection__Enabled=false \
            -e ForwardedHeaders__RequireKnownProxyInProduction=false \
            -e Rls__Enabled=true \
            -e Rls__SetSessionContext=true \
            -e DataProtection__PersistKeys=true \
            -e DataProtection__KeysPath=/tmp/dataprotection-keys \
            -e ConnectionStrings__NotrelixDb="Host=notrelix-ci-postgres;Port=5432;Database=notrelix;Username=postgres;Password=ci" \
            -e ConnectionStrings__Redis="notrelix-ci-redis:6379,password=ci" \
            -e Messaging__Transport=RabbitMQ \
            -e Messaging__RabbitMQ__Host=notrelix-ci-rabbitmq \
            -e Messaging__RabbitMQ__Port=5672 \
            -e Messaging__RabbitMQ__VHost=/ \
            -e Messaging__RabbitMQ__Username=rabbitmq \
            -e Messaging__RabbitMQ__Password=ci \
            -e JwtSettings__SecretKey="$JWT_SECRET" \
            -e JwtSettings__Issuer=https://ci.notrelix.invalid \
            -e JwtSettings__Audience=https://ci.notrelix.invalid \
            -e Email__ApiKey="$EMAIL_API_KEY" \
            -e Email__FromEmail=noreply@notrelix.invalid \
            -e Cors__AllowedOrigins__0=https://ci.notrelix.invalid \
            -e Frontend__AppBaseUrl=https://ci.notrelix.invalid \
            notrelix-ci/backend:${{ github.sha }}
          if [[ "$(docker exec notrelix-ci-backend-http id -u)" == 0 ]]; then docker logs notrelix-ci-backend-http; exit 1; fi
          code=000; attempts=0
          while [[ "$code" != 200 && "$attempts" -lt 60 ]]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/live || true)"
            attempts=$((attempts + 1))
            [[ "$code" != 200 ]] && sleep 3
          done
          if [[ "$code" != 200 ]]; then docker logs notrelix-ci-backend-http; exit 1; fi

  web-image:
    name: Web image validation
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build web image
        run: docker build --pull=false -f frontend/Dockerfile -t notrelix-ci/web:${{ github.sha }} .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/web:${{ github.sha }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Export SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/web:${{ github.sha }}
          format: spdx-json
          output: web.sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-web-sbom
          path: web.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify non-root and runtime health
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh notrelix-ci/web:${{ github.sha }} -c 'test "$(id -u)" != 0'
          container="notrelix-ci-web-${{ github.run_id }}"
          docker run -d --name "$container" -p 8080:8080 notrelix-ci/web:${{ github.sha }} >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          code=000; attempts=0
          while [[ "$code" != 200 && "$attempts" -lt 60 ]]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)"
            attempts=$((attempts + 1))
            [[ "$code" != 200 ]] && sleep 3
          done
          [[ "$code" == 200 ]] || { docker logs "$container"; exit 1; }

  marketing-image:
    name: Marketing image validation
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build marketing image
        run: docker build --pull=false -f frontend/Dockerfile.marketing -t notrelix-ci/marketing:${{ github.sha }} .
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/marketing:${{ github.sha }}
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Export SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: notrelix-ci/marketing:${{ github.sha }}
          format: spdx-json
          output: marketing.sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-marketing-sbom
          path: marketing.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify non-root and runtime health
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh notrelix-ci/marketing:${{ github.sha }} -c 'test "$(id -u)" != 0'
          container="notrelix-ci-marketing-${{ github.run_id }}"
          docker run -d --name "$container" -p 3000:3000 notrelix-ci/marketing:${{ github.sha }} >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          code=000; attempts=0
          while [[ "$code" != 200 && "$attempts" -lt 60 ]]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            attempts=$((attempts + 1))
            [[ "$code" != 200 ]] && sleep 3
          done
          [[ "$code" == 200 ]] || { docker logs "$container"; exit 1; }

  container-gate:
    name: Container CI gate
    if: always()
    needs: [changes, backend-image, web-image, marketing-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require container proof when selected
        env:
          BACKEND_SELECTED: ${{ needs.changes.outputs.backend }}
          WEB_SELECTED: ${{ needs.changes.outputs.web }}
          MARKETING_SELECTED: ${{ needs.changes.outputs.marketing }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          require(){ local name="$1" result="$2"; [[ "$result" == success ]] || { echo "::error::$name=$result"; exit 1; }; }
          result(){ jq -r --arg k "$1" '.[$k].result' <<<"$RESULTS"; }
          require changes "$(result changes)"
          if [[ "$BACKEND_SELECTED" == true ]]; then require backend-image "$(result backend-image)"; fi
          if [[ "$WEB_SELECTED" == true ]]; then require web-image "$(result web-image)"; fi
          if [[ "$MARKETING_SELECTED" == true ]]; then require marketing-image "$(result marketing-image)"; fi