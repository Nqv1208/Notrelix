name: Container CI
on:
  workflow_call:
    inputs:
      component_matrix_json: {required: true, type: string}
      component_count: {required: true, type: number}
      publication_mode: {required: false, type: string, default: none}
    outputs:
      application_manifest_json:
        value: ${{ jobs.collect.outputs.application_manifest_json }}
permissions: {contents: read}
jobs:
  build:
    if: inputs.component_count > 0 && contains(fromJSON('["none","rehearsal","release"]'), inputs.publication_mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read, packages: write, id-token: write, attestations: write, artifact-metadata: write}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.component_matrix_json) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: names
        env: {IMAGE_NAME: '${{ matrix.image_name }}', COMPONENT: '${{ matrix.component_id }}', MODE: '${{ inputs.publication_mode }}', RUN_ID: '${{ github.run_id }}', RUN_ATTEMPT: '${{ github.run_attempt }}'}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="ghcr.io/$owner/$IMAGE_NAME"; local="notrelix-ci/$COMPONENT:$GITHUB_SHA"
          if [[ "$MODE" == rehearsal ]]; then tag="rehearsal-$GITHUB_SHA-$RUN_ID-$RUN_ATTEMPT"; elif [[ "$MODE" == release ]]; then tag="sha-$GITHUB_SHA"; fi
          remote="$repo:$tag"
          { echo "repo=$repo"; echo "local=$local"; echo "remote=$remote"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
      - name: Build once
        env:
          CONTEXT: ${{ matrix.container_context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ steps.names.outputs.local }}
          BUILD_ARGS: ${{ toJSON(matrix.build_args) }}
        run: |
          set -euo pipefail
          args=(); while IFS= read -r line; do [[ -n "$line" ]] && args+=(--build-arg "$line"); done < <(jq -r 'to_entries[]?|"\(.key)=\(.value)"' <<<"$BUILD_ARGS")
          docker build --pull=false -f "$DOCKERFILE" -t "$IMAGE" "${args[@]}" "$CONTEXT"
      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: '${{ steps.names.outputs.local }}', exit-code: '1', ignore-unfixed: true, vuln-type: 'os,library', severity: 'HIGH,CRITICAL'}
      - name: Runtime smoke
        env:
          PROVIDER: ${{ matrix.provider }}
          IMAGE: ${{ steps.names.outputs.local }}
          PORT: ${{ matrix.runtime_port }}
          HEALTH: ${{ matrix.health_path }}
          SCHEME: ${{ matrix.health_scheme }}
          COMPONENT: ${{ matrix.component_id }}
          DEPS: ${{ toJSON(matrix.smoke_dependencies) }}
        run: |
          set -euo pipefail
          net="ci-${GITHUB_RUN_ID}-${COMPONENT}"; name="app-${COMPONENT}"; creds="$(mktemp)"
          trap 'rm -f "$creds"; docker rm -f "$name" ci-postgres ci-redis ci-rabbitmq >/dev/null 2>&1 || true; docker network rm "$net" >/dev/null 2>&1 || true' EXIT
          if [[ "$PROVIDER" == backend ]]; then
            postgres="$(jq -er .postgres <<<"$DEPS")"; redis="$(jq -er .redis <<<"$DEPS")"; rabbit="$(jq -er .rabbitmq <<<"$DEPS")"
            [[ "$postgres" == *@sha256:* && "$redis" == *@sha256:* && "$rabbit" == *@sha256:* ]]
            scripts/ci/generate-test-credentials.sh > "$creds"
            # shellcheck source=/dev/null
            source "$creds"; docker network create "$net" >/dev/null
            docker run -d --name ci-postgres --network "$net" -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" -e POSTGRES_DB=notrelix "$postgres" >/dev/null
            docker run -d --name ci-redis --network "$net" "$redis" redis-server --requirepass "$REDIS_PASSWORD" >/dev/null
            docker run -d --name ci-rabbitmq --network "$net" -e RABBITMQ_DEFAULT_USER=rabbitmq -e RABBITMQ_DEFAULT_PASS="$RABBITMQ_PASSWORD" "$rabbit" >/dev/null
            for _ in $(seq 1 45); do docker exec ci-postgres pg_isready -U postgres -d notrelix >/dev/null 2>&1 && break; sleep 1; done
            for _ in $(seq 1 60); do docker exec ci-rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1 && break; sleep 1; done
            docker run -d --name "$name" --network "$net" -P -e ASPNETCORE_ENVIRONMENT=Production -e ASPNETCORE_URLS="http://+:$PORT" -e HttpsRedirection__Enabled=false -e ForwardedHeaders__RequireKnownProxyInProduction=false -e Rls__Enabled=true -e Rls__SetSessionContext=true -e DataProtection__PersistKeys=true -e DataProtection__KeysPath=/tmp/dataprotection-keys -e ConnectionStrings__NotrelixDb="Host=ci-postgres;Database=notrelix;Username=postgres;Password=$POSTGRES_PASSWORD" -e ConnectionStrings__Redis="ci-redis:6379,password=$REDIS_PASSWORD" -e Messaging__Transport=RabbitMQ -e Messaging__RabbitMQ__Host=ci-rabbitmq -e Messaging__RabbitMQ__Port=5672 -e Messaging__RabbitMQ__VHost=/ -e Messaging__RabbitMQ__Username=rabbitmq -e Messaging__RabbitMQ__Password="$RABBITMQ_PASSWORD" -e JwtSettings__SecretKey="$JWT_SECRET" -e JwtSettings__Issuer='https://ci.notrelix.invalid' -e JwtSettings__Audience='https://ci.notrelix.invalid' -e Email__ApiKey="$EMAIL_API_KEY" -e Email__FromEmail='noreply@notrelix.invalid' -e Cors__AllowedOrigins__0='https://ci.notrelix.invalid' -e Frontend__AppBaseUrl='https://ci.notrelix.invalid' "$IMAGE" >/dev/null
          else
            docker run -d --name "$name" -P "$IMAGE" >/dev/null
          fi
          uid="$(docker exec "$name" id -u 2>/dev/null || echo 0)"; [[ "$uid" != 0 ]]
          hp="$(docker port "$name" "$PORT/tcp" | awk -F: 'END{print $NF}')"; [[ -n "$hp" ]]
          for _ in $(seq 1 60); do curl -fsS --max-time 3 "$SCHEME://127.0.0.1:$hp$HEALTH" >/dev/null && exit 0; sleep 2; done
          docker logs "$name"; exit 1
      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: '${{ steps.names.outputs.local }}', format: spdx-json, output: component.spdx.json, exit-code: '0'}
      - name: Publish proven bytes
        if: inputs.publication_mode != 'none'
        env: {GH_TOKEN: '${{ github.token }}', LOCAL: '${{ steps.names.outputs.local }}', REMOTE: '${{ steps.names.outputs.remote }}'}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL" "$REMOTE"; docker push "$REMOTE"
      - id: subject
        env: {MODE: '${{ inputs.publication_mode }}', LOCAL: '${{ steps.names.outputs.local }}', REMOTE: '${{ steps.names.outputs.remote }}'}
        run: |
          if [[ "$MODE" != none ]]; then docker pull "$REMOTE" >/dev/null; ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$REMOTE")"; [[ "$ref" == *@sha256:* ]]; digest="${ref##*@}"; else ref="$LOCAL"; digest="$(docker image inspect --format '{{.Id}}' "$LOCAL")"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: inputs.publication_mode != 'none'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with: {subject-name: '${{ steps.names.outputs.repo }}', subject-digest: '${{ steps.subject.outputs.digest }}', push-to-registry: true}
      - if: inputs.publication_mode != 'none'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with: {subject-name: '${{ steps.names.outputs.repo }}', subject-digest: '${{ steps.subject.outputs.digest }}', sbom-path: component.spdx.json, push-to-registry: true}
      - name: Write result
        env:
          ID: ${{ matrix.component_id }}
          REF: ${{ steps.subject.outputs.ref }}
          SERVICE: ${{ matrix.compose_service }}
          ENVVAR: ${{ matrix.deploy_env_var }}
          MODE: ${{ inputs.publication_mode }}
        run: |
          mkdir -p artifacts/container
          jq -n --arg id "$ID" --arg ref "$REF" --arg service "$SERVICE" --arg env "$ENVVAR" --arg mode "$MODE" --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{id:$id,kind:"application",ref:$ref,compose_service:$service,deploy_env_var:$env,stateful:false,publication_mode:$mode,source_sha:$source,run_id:$run,run_attempt:$attempt,published:($mode!="none")}' > "artifacts/container/$ID.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'container-result-${{ matrix.component_id }}', path: 'artifacts/container/${{ matrix.component_id }}.json', if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'sbom-${{ matrix.component_id }}', path: component.spdx.json, if-no-files-found: error, retention-days: 30}
      - uses: ./.github/actions/emit-evidence
        with: {proof_id: 'container:${{ matrix.component_id }}', component_id: '${{ matrix.component_id }}', metadata: 'publication_mode=${{ inputs.publication_mode }}'}
  collect:
    if: always() && inputs.component_count > 0
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      application_manifest_json: ${{ steps.collect.outputs.application_manifest_json }}
    steps:
      - run: '[[ "${{ needs.build.result }}" == success ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'container-result-*', path: artifacts/results, merge-multiple: true}
      - id: collect
        env:
          MATRIX: '${{ inputs.component_matrix_json }}'
          MODE: '${{ inputs.publication_mode }}'
          SOURCE: '${{ github.sha }}'
        run: |
          mapfile -t files < <(find artifacts/results -type f -name '*.json' | sort); [[ ${#files[@]} -gt 0 ]]
          expected="$(jq -c '[.include[].component_id]|sort' <<<"$MATRIX")"; actual="$(jq -s -c '[.[].id]|sort' "${files[@]}")"; [[ "$expected" == "$actual" ]]
          jq -e -s --arg mode "$MODE" --arg source "$SOURCE" 'all(.[];.publication_mode==$mode and .source_sha==$source)' "${files[@]}" >/dev/null
          if [[ "$MODE" != none ]]; then jq -e -s 'all(.[];.published==true and (.ref|contains("@sha256:")))' "${files[@]}" >/dev/null; else jq -e -s 'all(.[];.published==false)' "${files[@]}" >/dev/null; fi
          jq -s --arg mode "$MODE" --arg source "$SOURCE" '{api_version:"delivery.notrelix.dev/v1",kind:"ApplicationImageSet",publication_mode:$mode,source_sha:$source,images:(sort_by(.compose_service))}' "${files[@]}" > application-images.json
          echo "application_manifest_json=$(jq -c . application-images.json)" >> "$GITHUB_OUTPUT"
