name: Emit CI evidence
description: Emit one execution-plane proof record without invoking the delivery control plane.
inputs:
  proof_id: {required: true, description: Canonical proof identifier}
  component_id: {required: false, default: repository}
  metadata: {required: false, default: ""}
runs:
  using: composite
  steps:
    - id: record
      shell: bash
      env:
        PROOF_ID: ${{ inputs.proof_id }}
        COMPONENT_ID: ${{ inputs.component_id }}
        METADATA: ${{ inputs.metadata }}
      run: |
        set -euo pipefail
        slug(){ sed -E 's/[^A-Za-z0-9._-]+/-/g;s/^-+|-+$//g' <<<"$1" | tr '[:upper:]' '[:lower:]'; }
        out="$GITHUB_WORKSPACE/artifacts/ci/evidence"; mkdir -p "$out"
        path="$out/$(slug "$PROOF_ID")--$(slug "$COMPONENT_ID").json"
        metadata='{}'
        if [[ -n "$METADATA" ]]; then
          [[ "$METADATA" == *=* ]]
          key="${METADATA%%=*}"; value="${METADATA#*=}"
          metadata="$(jq -cn --arg k "$key" --arg v "$value" '{($k):$v}')"
        fi
        body="$(jq -cS -n --arg proof "$PROOF_ID" --arg component "$COMPONENT_ID" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg workflow "$GITHUB_WORKFLOW" --arg job "$GITHUB_JOB" --arg time "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --argjson metadata "$metadata" '{api_version:"delivery.notrelix.dev/v1",kind:"EvidenceRecord",proof_id:$proof,component_id:$component,status:"passed",source_sha:$sha,run_id:$run,run_attempt:$attempt,workflow:$workflow,job:$job,created_at:$time,metadata:$metadata}')"
        digest="$(printf '%s' "$body" | sha256sum | awk '{print $1}')"
        jq -S --arg digest "$digest" '.+{record_sha256:$digest}' <<<"$body" > "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "artifact_name=ci-evidence-$(slug "$PROOF_ID")-$(slug "$COMPONENT_ID")" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.record.outputs.artifact_name }}
        path: ${{ steps.record.outputs.path }}
        if-no-files-found: error
        retention-days: 30
