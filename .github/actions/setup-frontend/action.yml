name: Setup Notrelix frontend
description: Install repository-pinned Node and pnpm, then perform a frozen workspace install.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: frontend/.node-version
    - name: Activate repository-pinned pnpm
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare "$(node -p "require('./frontend/package.json').packageManager")" --activate
    - name: Verify pnpm version
      shell: bash
      run: |
        set -euo pipefail
        expected="$(node -p "require('./frontend/package.json').packageManager")"
        actual="pnpm@$(pnpm --version)"
        [[ "$actual" == "$expected" ]]
    - name: Resolve pnpm store path
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: Install frontend workspace
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
