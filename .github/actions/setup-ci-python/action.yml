name: Setup Notrelix CI Python
description: Install the repository-pinned CI Python and verify stdlib contracts

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version-file: .python-version
    - shell: bash
      name: Verify CI delivery runtime
      run: |
        set -euo pipefail
        actual="$(python3 -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
        echo "ci-python=${actual}" >> "$GITHUB_STEP_SUMMARY"
        python3 - <<'PY'
        import sys
        if sys.version_info < (3, 11):
            raise SystemExit("CI delivery tooling requires Python >=3.11")
        try:
            import tomllib
        except ModuleNotFoundError:
            raise SystemExit("CI delivery tooling requires tomllib (Python >=3.11)")
        print("CI delivery runtime OK")
        PY
