name: Use the backend build
description: Unpack the Release build made by the backend-build job and restore the NuGet cache, so a test job runs dotnet test --no-build --no-restore.
inputs:
  restore-target:
    description: Project or solution to restore if the NuGet cache misses (a normal restore, only to download packages).
    default: backend.slnx
runs:
  using: composite
  steps:
    # Same key as the backend-build job, which saves it; test jobs only read it.
    - name: Restore NuGet packages cache
      id: nuget
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.*.props', 'backend/global.json') }}
        restore-keys: nuget-${{ runner.os }}-
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: backend-build
        path: ${{ runner.temp }}/backend-build
    - name: Unpack the build output
      shell: bash
      working-directory: backend
      run: |
        set -euo pipefail
        tar -xzf "$RUNNER_TEMP/backend-build/backend-build.tgz"
    - name: Download packages the cache did not have
      if: steps.nuget.outputs.cache-hit != 'true'
      shell: bash
      working-directory: backend
      run: dotnet restore "${{ inputs.restore-target }}"
