# =============================================================================
# Production overlay — pairs with docker-compose.yml (base infra).
#
# Usage:
#   docker compose --env-file .env.prod \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     up -d --build
# =============================================================================

services:

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8000
      ConnectionStrings__NotrelixDb: ${CONNECTIONSTRINGS_NOTRELIXDB:?CONNECTIONSTRINGS_NOTRELIXDB is required}
      ConnectionStrings__Redis: ${CONNECTIONSTRINGS_REDIS:?CONNECTIONSTRINGS_REDIS is required}
      SeedData__Enabled: "false"
      JwtSettings__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      JwtSettings__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      Email__ApiKey: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      Email__FromEmail: ${EMAIL_FROM:-noreply@notrelix.app}
      Email__FromName: ${EMAIL_FROM_NAME:-Notrelix}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_ENV: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - frontend-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - backend-network
      - frontend-network

volumes:
  frontend_node_modules:
  frontend_next:
