# =============================================================================
# Production — hardening, port 80, logging (Compose không áp dụng deploy.* ngoài Swarm)
# Chạy: docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  postgres:
    container_name: notrelix-postgres-prod

  redis:
    container_name: notrelix-redis-prod

  backend:
    container_name: notrelix-backend-prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  frontend:
    container_name: notrelix-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_APP_ENV: production

  nginx:
    container_name: notrelix-nginx-prod
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
