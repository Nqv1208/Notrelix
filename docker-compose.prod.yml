# =============================================================================
# Production overlay — pairs with docker-compose.yml.
#
# Canonical deploys add release.generated.yml (digest-pinned) and use --no-build.
# TLS terminates at a managed edge/load balancer. The origin HTTP port must be
# firewall-restricted to that edge; infra/nginx/nginx.prod.conf then forwards
# the canonical public scheme as HTTPS to application services.
# =============================================================================
services:
  # Repeat stateful auth requirements here so production cannot silently fall
  # back to development credentials from a local/base topology.
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8000
      # NotrelixDb connects as notrelix_app and NotrelixWorkerDb as notrelix_worker (their passwords are the
      # ones --rls-apply provisions); NotrelixMigrationDb is the owner, used by migrate / seed / rls-apply only.
      ConnectionStrings__NotrelixDb: ${CONNECTIONSTRINGS_NOTRELIXDB:?CONNECTIONSTRINGS_NOTRELIXDB is required}
      ConnectionStrings__NotrelixWorkerDb: ${CONNECTIONSTRINGS_NOTRELIXWORKERDB:?CONNECTIONSTRINGS_NOTRELIXWORKERDB is required}
      ConnectionStrings__NotrelixMigrationDb: ${CONNECTIONSTRINGS_NOTRELIXMIGRATIONDB:?CONNECTIONSTRINGS_NOTRELIXMIGRATIONDB is required}
      ConnectionStrings__Redis: ${CONNECTIONSTRINGS_REDIS:?CONNECTIONSTRINGS_REDIS is required}
      Rls__RoleEnforcement: Enforce
      SeedData__Enabled: "false"
      JwtSettings__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
      JwtSettings__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      # The platform operator console is off until both are set: its own database login (notrelix_operator,
      # provisioned from this string) and its own signing key. Never reuse JWT_SECRET. The seeded operator
      # password is read once and hashed; an existing operator is never overwritten.
      ConnectionStrings__NotrelixOperatorDb: ${NOTRELIX_OPERATOR_DB_CONNECTION:-}
      Operator__Jwt__SigningKey: ${OPERATOR_JWT_SIGNING_KEY:-}
      Operator__Jwt__Audience: ${OPERATOR_JWT_AUDIENCE:-notrelix-operator-console}
      Operator__Seed__Email: ${OPERATOR_SEED_EMAIL:-}
      Operator__Seed__Password: ${OPERATOR_SEED_PASSWORD:-}
      Email__ApiKey: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      Email__FromEmail: ${EMAIL_FROM:-noreply@notrelix.app}
      Email__FromName: ${EMAIL_FROM_NAME:-Notrelix}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # Browser CSRF enforcement is mandatory outside Development/Testing (ADR-005);
      # not env-overridable, and startup fails if it is disabled here.
      Security__Csrf__Enabled: "true"
      Messaging__Transport: RabbitMQ
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: "5672"
      Messaging__RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      Messaging__RabbitMQ__Username: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      ForwardedHeaders__RequireKnownProxyInProduction: "true"
      ForwardedHeaders__KnownNetworks__0: ${BACKEND_NETWORK_SUBNET:-172.28.0.0/24}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network
      - backend-egress-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend-marketing:
    build:
      context: .
      dockerfile: frontend/Dockerfile.marketing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - frontend-network

  frontend-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - frontend-network

  nginx:
    image: ${NOTRELIX_NGINX_IMAGE:-nginx:1.29-alpine-slim}
    restart: unless-stopped
    user: nginx
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-marketing
      - frontend-web
    networks:
      - backend-network
      - frontend-network
