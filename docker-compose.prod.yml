version: "3.9"

services:
  postgres:
    container_name: todoapp-postgres-prod

  redis:
    container_name: todoapp-redis-prod

  backend:
    container_name: todoapp-backend-prod
    environment:
      - ENV=production

  frontend:
    container_name: todoapp-frontend-prod

  nginx:
    image: nginx:alpine
    container_name: todoapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend-network