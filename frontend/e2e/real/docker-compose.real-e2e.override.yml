services:
  postgres:
    container_name: notrelix-fe-real-e2e-postgres
    restart: "no"
    ports:
      - "0.0.0.0:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${REAL_E2E_POSTGRES_PASSWORD:-real-e2e-postgres-password}
      POSTGRES_DB: notrelix_real_e2e
    volumes:
      - real_e2e_postgres_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notrelix_real_e2e"]

  redis:
    container_name: notrelix-fe-real-e2e-redis
    restart: "no"
    ports:
      - "0.0.0.0:56379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REAL_E2E_REDIS_PASSWORD:-real-e2e-redis-password}
      - --appendonly
      - "no"

  rabbitmq:
    container_name: notrelix-fe-real-e2e-rabbitmq
    restart: "no"
    ports: !override
      - "127.0.0.1:55672:5672"

  backend:
    image: mcr.microsoft.com/dotnet/sdk:9.0.317
    container_name: notrelix-fe-real-e2e-backend
    restart: "no"
    ports:
      - "0.0.0.0:58000:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8000
      ConnectionStrings__NotrelixDb: Host=postgres;Port=5432;Database=notrelix_real_e2e;Username=notrelix_app;Password=${REAL_E2E_APP_DB_PASSWORD:-real-e2e-app-password}
      ConnectionStrings__NotrelixWorkerDb: Host=postgres;Port=5432;Database=notrelix_real_e2e;Username=notrelix_worker;Password=${REAL_E2E_WORKER_DB_PASSWORD:-real-e2e-worker-password}
      ConnectionStrings__NotrelixMigrationDb: Host=postgres;Port=5432;Database=notrelix_real_e2e;Username=postgres;Password=${REAL_E2E_POSTGRES_PASSWORD:-real-e2e-postgres-password}
      ConnectionStrings__Redis: redis:6379,password=${REAL_E2E_REDIS_PASSWORD:-real-e2e-redis-password}
      Rls__RoleEnforcement: Enforce
      # The development settings turn the browser CSRF gate off; the real runs keep it on so a
      # write that skips the token fails here and the stale-token recovery is proven.
      Security__Csrf__Enabled: "true"
      # Every spec signs in on its own, far above the per-minute credential limit of one address.
      RateLimiting__Policies__AuthCredentialByIp__PermitLimit: "1000"
      Database__MigrateOnStartup: "true"
      SeedData__Enabled: "true"
      SeedData__RunOnStartup: "true"
      SeedData__Profile: Small
      SeedData__ResetBeforeSeed: "false"
      JwtSettings__SecretKey: ${REAL_E2E_JWT_SECRET:-real-e2e-jwt-secret-at-least-thirty-two-chars}
      JwtSettings__Issuer: http://127.0.0.1:58000
      JwtSettings__Audience: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}
      # Test-only operator console values (this stack only; no real environment carries them).
      ConnectionStrings__NotrelixOperatorDb: Host=postgres;Port=5432;Database=notrelix_real_e2e;Username=notrelix_operator;Password=${REAL_E2E_OPERATOR_DB_PASSWORD:-real-e2e-operator-db-password}
      Operator__Jwt__SigningKey: ${REAL_E2E_OPERATOR_JWT_SECRET:-real-e2e-operator-signing-key-at-least-32-chars}
      Operator__Seed__Email: ${REAL_E2E_OPERATOR_EMAIL:-operator@notrelix.test}
      Operator__Seed__Password: ${REAL_E2E_OPERATOR_PASSWORD:-real-e2e-operator-password}
      Cors__AllowedOrigins__1: http://127.0.0.1:${REAL_E2E_OPERATOR_PORT:-5180}
      Cors__AllowedOrigins__0: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}
      Frontend__AppBaseUrl: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}
      # The browser comes back to this web app after a provider sign-in, a refusal included.
      OAuth__FrontendSuccessUrl: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}/auth/callback
      OAuth__FrontendFailureUrl: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}/sign-in
      OAuth__FrontendMfaUrl: http://127.0.0.1:${REAL_E2E_WEB_PORT:-5173}/sign-in?step=mfa
    command:
      - dotnet
      - run
      - --project
      - src/Notrelix.API/Notrelix.API.csproj
      - --no-launch-profile

volumes:
  real_e2e_postgres_init:
