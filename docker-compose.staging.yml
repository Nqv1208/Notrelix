# =============================================================================
# Staging overlay — pairs with docker-compose.yml.
# Automated release proof adds release.generated.yml and uses --no-build.
# =============================================================================
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8000
      ConnectionStrings__NotrelixDb: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-notrelix_staging};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      SeedData__Enabled: "true"
      SeedData__Profile: Small
      SeedData__ResetBeforeSeed: "false"
      JwtSettings__SecretKey: ${JWT_SECRET:?JWT_SECRET is required}
      JwtSettings__Issuer: ${JWT_ISSUER:-http://localhost}
      JwtSettings__Audience: ${JWT_AUDIENCE:-http://localhost}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromEmail: ${EMAIL_FROM:-noreply@notrelix.app}
      Email__FromName: ${EMAIL_FROM_NAME:-Notrelix}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost}
      Security__Csrf__Enabled: ${SECURITY__CSRF__ENABLED:-false}
      HttpsRedirection__Enabled: ${HTTPS_REDIRECTION_ENABLED:-true}
      # Fail-closed application contracts for non-development environments.
      Rls__Enabled: "true"
      Rls__SetSessionContext: "true"
      DataProtection__PersistKeys: "true"
      DataProtection__KeysPath: /tmp/dataprotection-keys
      Frontend__AppBaseUrl: ${FRONTEND_APP_BASE_URL:-http://localhost}
      Messaging__Transport: RabbitMQ
      Messaging__RabbitMQ__Host: rabbitmq
      Messaging__RabbitMQ__Port: "5672"
      Messaging__RabbitMQ__VHost: ${RABBITMQ_VHOST:-/}
      Messaging__RabbitMQ__Username: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      Messaging__RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      ForwardedHeaders__RequireKnownProxyInProduction: "true"
      ForwardedHeaders__KnownNetworks__0: ${BACKEND_NETWORK_SUBNET:-172.28.0.0/24}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-network
      - backend-egress-network
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend-marketing:
    build:
      context: .
      dockerfile: frontend/Dockerfile.marketing
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - frontend-network

  frontend-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - frontend-network

  nginx:
    image: ${NOTRELIX_NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    user: nginx
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend-marketing
      - frontend-web
    networks:
      - backend-network
      - frontend-network
