# Production gateway contract. /api/v1/realtime goes to backend-realtime; the rest of /api and /health go to backend-api.
# TLS terminates at the managed edge. The origin port must be restricted by
# host/cloud firewall to that trusted edge. The gateway itself is HTTP-only and
# forwards the canonical public scheme/port as HTTPS/443.
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 25m;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # Single-VM staging behind Caddy: Caddy sets X-Forwarded-For to the real peer and reaches this gateway through
  # the published loopback port, so nginx sees the frontend-network bridge gateway as the peer. Trust that one
  # address only (docker-compose.staging.yml pins the subnet to 172.29.0.0/24) and take the client from the
  # header, so rate limits and audit logs key on the real IP. Never widen this to a range or 0.0.0.0/0.
  set_real_ip_from 172.29.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    # Keep HTTP/2 off: nginx2root CVE-2026-123007 and CVE-2026-123633 are HTTP/2 RCEs.
    http2 off;
    server_name _;

    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # API/health share one trusted edge contract. We intentionally do not use
    # $scheme here because the origin hop is HTTP after edge TLS termination.
    location = /health {
      set $backend_upstream http://backend-api:8000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }

    location ^~ /health/ {
      set $backend_upstream http://backend-api:8000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }

    # WebSocket realtime gateway. Its own upstream, so the upgrade headers and the long read timeout
    # (the gateway caps a connection at one hour and pings every 25 s) apply only here.
    location ^~ /api/v1/realtime {
      set $realtime_upstream http://backend-realtime:8000;
      proxy_pass $realtime_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
      proxy_connect_timeout 60s;
      proxy_send_timeout 3700s;
      proxy_read_timeout 3700s;
    }

    location ^~ /api/ {
      set $backend_upstream http://backend-api:8000;
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
      set $web_upstream http://frontend-web:8080;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(sign-in|sign-up|forgot-password|reset-password|verify-email|auth/callback|invite|onboarding|welcome|f|workspaces|account/workspaces|home)(/|$) {
      set $web_upstream http://frontend-web:8080;
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      set $marketing_upstream http://frontend-marketing:3000;
      proxy_pass $marketing_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
