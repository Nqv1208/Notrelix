; PgBouncer in front of PostgreSQL for the backend's request and worker logins (scale plan sections 4.2 and 13.1).
;
; Transaction pooling: a server connection serves one transaction at a time. Everything the backend relies on
; is transaction-scoped: RLS session values are set with set_config(..., true), advisory locks are the xact
; variants, and the backend uses no session SET, LISTEN, temp tables or protocol-level prepared statements.
;
; Migrations, rls-apply and seed do NOT go through this pooler. Their connection string
; (ConnectionStrings__NotrelixMigrationDb) points straight at postgres.
;
; The compose service writes /tmp/pgbouncer-userlist.txt from the two runtime login passwords at start.

[databases]
; Any database name the client asks for, on the same server (staging and production use different names).
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer-userlist.txt
pool_mode = transaction

; Client side: three backend processes, each with an Npgsql pool of up to 100 connections.
max_client_conn = 600

; Server side: two runtime logins x 30 = 60 server connections, leaving headroom under PostgreSQL's
; default max_connections of 100 for owner-direct work (migrations, rls-apply, seed) and for operators.
default_pool_size = 30
reserve_pool_size = 5
reserve_pool_timeout = 3
min_pool_size = 0
server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 30
server_login_retry = 3

; Npgsql and the server send these at connect; transaction pooling must not reject them.
ignore_startup_parameters = extra_float_digits

; Protocol-level prepared statements are not used (Npgsql auto-prepare is off by default). Keep them off.
max_prepared_statements = 0

admin_users =
stats_users =
log_connections = 0
log_disconnections = 0
