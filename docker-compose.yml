# =============================================================================
# Base infrastructure — shared by staging and production overlays.
#
# Application services are defined by the environment overlays. Stateful
# infrastructure lives here so all environments share one topology contract.
# Automated releases override every runtime image with digest-pinned subjects
# from delivery/images.lock.toml via release.generated.yml.
# =============================================================================
name: notrelix

services:
  postgres:
    image: ${NOTRELIX_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-notrelix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notrelix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-network
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: ${NOTRELIX_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network
    logging: *default-logging

  # RabbitMQ is not optional for Staging/Production: both API environment
  # contracts select Messaging:Transport=RabbitMQ. Keeping it outside a Compose
  # profile prevents a release from becoming healthy without its broker.
  rabbitmq:
    image: ${NOTRELIX_RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend-network
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  # Stable CIDR lets ASP.NET trust exactly the isolated reverse-proxy network
  # instead of trusting arbitrary X-Forwarded-* senders. Override only when the
  # host already uses this CIDR.
  backend-network:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_NETWORK_SUBNET:-172.28.0.0/24}

  # Public-facing application containers and the gateway live here. It also
  # supplies normal outbound connectivity to marketing/web where required.
  frontend-network:
    driver: bridge

  # Backend needs outbound access for approved integrations (email, N8n, etc.)
  # but does not need peer connectivity to frontend containers. A dedicated
  # egress network preserves that boundary.
  backend-egress-network:
    driver: bridge
