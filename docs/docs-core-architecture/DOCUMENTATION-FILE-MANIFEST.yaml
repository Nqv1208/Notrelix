version: 1
name: notrelix-documentation-core
principle: "one topic, one canonical owner, executable evidence"
root:
  keep_or_rewrite:
    - README.md
    - AGENTS.md
    - RULE.md
    - PRODUCT.md
    - DESIGN.md
    - CONTEXT.md
    - CONTEXT-MAP.md
    - CLAUDE.md
  delete:
    - SKILL.md
    - MEMORY.md
repository_docs:
  root: docs
  directories:
    governance:
      - documentation-authority.md
      - documentation-lifecycle.md
      - topic-authority-map.md
      - decision-and-exception-policy.md
      - documentation-quality-gates.md
    architecture:
      - system-overview.md
      - bounded-context-map.md
      - contract-boundaries.md
      - data-ownership-and-consistency.md
      - events-realtime-and-delivery-boundary.md
      - capability-extraction-strategy.md
    product:
      - README.md
      - product-model.md
      - product-experience.md
      - contexts/accounts.md
      - contexts/identity.md
      - contexts/workspaces.md
      - contexts/governance.md
      - contexts/work-management.md
      - contexts/documents.md
      - contexts/collaboration.md
      - contexts/automation.md
      - contexts/integrations.md
      - contexts/billing.md
      - contexts/analytics.md
    quality:
      - engineering-quality-standard.md
      - testing-strategy.md
      - security-quality-standard.md
      - accessibility-standard.md
      - performance-and-scalability.md
    delivery:
      - change-classification.md
      - change-impact-and-migration.md
      - definition-of-done.md
      - release-rollout-and-recovery.md
    operations:
      - observability.md
      - incident-readiness.md
      - recovery-and-data-safety.md
      - service-degradation.md
    infrastructure:
      - environment-model.md
      - deployment-runtime.md
      - containerization-and-local-services.md
    decisions:
      - README.md
    templates:
      - adr-template.md
      - architecture-change-template.md
      - feature-spec-template.md
      - migration-plan-template.md
      - incident-template.md
      - pr-checklist.md
    generated:
      - document-index.md
      - rule-index.md
backend:
  root_docs:
    - backend/README.md
    - backend/AGENTS.md
    - backend/CONTEXT.md
    - backend/tests/AGENTS.md
  architecture:
    - backend/docs/architecture/backend-overview.md
    - backend/docs/architecture/domain-modeling.md
    - backend/docs/architecture/application-model.md
    - backend/docs/architecture/infrastructure-and-data.md
    - backend/docs/architecture/platform-and-messaging.md
    - backend/docs/architecture/api-and-contracts.md
    - backend/docs/architecture/security-tenancy-authorization.md
    - backend/docs/architecture/testing-and-quality-gates.md
  operations:
    - backend/docs/operations/configuration-and-runtime.md
    - backend/docs/operations/migrations-and-data-change.md
  decisions:
    - backend/docs/decisions/README.md
  generated:
    - backend/docs/generated/project-map.md
  remove_or_reduce:
    - backend/PROJECT-MAP.md
    - backend/src/Notrelix.Application/README.md
frontend:
  root_docs:
    - frontend/README.md
    - frontend/AGENTS.md
  architecture:
    - frontend/docs/architecture/frontend-overview.md
    - frontend/docs/architecture/dependency-boundaries.md
    - frontend/docs/architecture/hosts-composition-routing.md
    - frontend/docs/architecture/api-and-contracts.md
    - frontend/docs/architecture/state-query-mutations.md
    - frontend/docs/architecture/realtime.md
    - frontend/docs/architecture/ui-and-design-system.md
    - frontend/docs/architecture/testing-and-quality-gates.md
    - frontend/docs/architecture/architecture-change-policy.md
  decisions:
    - frontend/docs/decisions/README.md
  generated:
    - frontend/docs/generated/package-boundaries.md
agent_skills:
  root: .agents/skills
  registry: .agents/skills/README.md
  skills:
    - architecture-review/SKILL.md
    - add-domain-capability/SKILL.md
    - implement-backend-use-case/SKILL.md
    - add-frontend-capability/SKILL.md
    - contract-change/SKILL.md
    - data-migration/SKILL.md
    - freeze-certification/SKILL.md
forbidden_after_migration:
  - docs/engineering
  - docs-refoundation
  - SKILL.md
  - MEMORY.md
  - backend/RULE.md
  - backend/PROMPT.md
  - frontend/RULES.md
  - frontend/ARCHITECTURE.md
  - frontend/MIGRATION_TRACKER.md
