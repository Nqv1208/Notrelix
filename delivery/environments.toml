schema_version = 4

# Environment names intentionally equal the GitHub Environment names. Job-level
# GitHub Environment and concurrency expressions cannot be sourced from a file
# at step runtime, so those mechanics are generic functions of environment_name,
# not duplicated config pretending to be authoritative.
[environments.staging]
compose_overlay = "docker-compose.staging.yml"
promotion_mode = "automatic-after-main-ci"
run_migrations = true
smoke_profile = "critical"
stateful_image_change_policy = "explicit-override"

[environments.production]
compose_overlay = "docker-compose.prod.yml"
promotion_mode = "manual-promotion"
run_migrations = true
smoke_profile = "critical"
stateful_image_change_policy = "explicit-override"
